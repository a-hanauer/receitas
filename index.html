<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fornada">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Fornada</title>
<style>
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --ink:#171716; --ink2:#3B3A37; --muted:#6B6963;
  --line:#E8E7E3; --line2:#D6D4CE; --press:#F1F0EC; --hl:#FFF3D6;
  --tone:#E07B2E; --ok:#2F7D4F; --warn:#A84E16; --danger:#B42318; --star:#D99A06;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121211;--surface:#1C1C1A;--ink:#F2F1EE;--ink2:#CFCDC7;--muted:#9A978F;--line:#2B2A27;--line2:#403E3A;--press:#262523;--hl:#2E2617;--ok:#5DB27F;--warn:#E8925A;--danger:#F28B82;--star:#F2B634}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(40px + var(--safe-b))}
.cap{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.cap.center{text-align:center}
em{font-style:normal;color:var(--muted);font-weight:400}

/* ---------- Componentes ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:25px;border:1px solid transparent;background:none;font-size:16px;font-weight:600;text-decoration:none}
.btn svg{width:16px;height:16px;flex:none}
.btn.block{width:100%}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.secondary{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.ghost{color:var(--ink2)}
.btn.danger{background:var(--surface);border-color:var(--line2);color:var(--danger)}
.btn:active{opacity:.85}
.icon-btn{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:22px;background:none;color:var(--ink);text-decoration:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:40px;height:40px}
.icon-btn.sm svg{width:16px;height:16px}
.icon-btn:active{background:var(--press)}
.badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.link{background:none;border:0;padding:0;color:var(--ink);font-size:15px;font-weight:550;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;margin-left:-6px;padding:0 6px;border:0;background:none;color:var(--ink);font-size:17px}
.back svg{width:10px;height:17px}
.tbtn{height:34px;padding:0 13px;border:0;border-radius:17px;background:var(--press);font-size:14px;font-weight:550}
.seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--press)}
.seg button{flex:1;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:15px;font-weight:550}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
.switch{position:relative;flex:none;width:51px;height:31px;border:0;border-radius:16px;background:var(--line2);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked=true]{background:var(--ok)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.chip{flex:none;height:38px;padding:0 15px;border:1px solid var(--line2);border-radius:19px;background:var(--surface);font-size:15px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{height:32px;padding:0 12px;font-size:14px}
.card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{flex:none;white-space:nowrap;font-size:16px;color:var(--ink2)}
.field select{flex:1;min-width:0;padding:14px 22px 14px 0;border:0;background:transparent;text-align:right;text-align-last:right;font-size:16px;font-weight:550;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 7px) 50%,calc(100% - 2px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.amt{display:flex;align-items:center;gap:6px}
.amt input{width:96px;height:40px;padding:0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);text-align:right;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.amt span{min-width:24px;color:var(--muted);font-size:16px}
.swatch{position:relative;flex:none;width:40px;height:40px;overflow:hidden;border-radius:12px}
.swatch i{position:absolute;top:0;left:0;right:0;height:11px}
.swatch.lg{width:52px;height:52px;border-radius:15px}
.swatch.lg i{height:14px}
.chev{flex:none;width:8px;height:14px;color:var(--line2)}
.mt{margin-top:12px}

/* ---------- Início ---------- */
.home-head{padding:calc(18px + var(--safe-t)) 0 18px}
.hh-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.home-head h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
.hh-btns{display:flex;gap:2px;margin-right:-10px}
.home-head p{margin:6px 0 0;color:var(--muted)}
.cake-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cake-row{display:flex;align-items:center;gap:14px;min-height:72px;padding:14px 2px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.cake-row:active{background:var(--press)}
.cake-row .txt{flex:1;min-width:0;display:block}
.cake-row b{display:block;color:var(--ink);font-size:17px;font-weight:600;letter-spacing:-.01em}
.cake-row .txt>span{display:block;overflow:hidden;color:var(--muted);font-size:14px;white-space:nowrap;text-overflow:ellipsis}
.cake-row .txt>span.miss{color:var(--warn);white-space:normal}
.cake-row .txt>span.swap{color:var(--ink2);white-space:normal}
.cake-row .txt>span.pan-note{color:var(--ink2);white-space:normal}
.pantry{margin:0 0 8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.pantry-toggle,.qty-toggle{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;font-weight:600}
.pantry-toggle{height:54px;padding:0 16px;font-size:17px}
.pantry-toggle>span:first-child,.qty-toggle>span:first-child{flex:1}
.pantry-count{color:var(--muted);font-size:15px;font-weight:500}
.pchev{width:13px;height:8px;color:var(--muted);transition:transform .2s}
.pantry.open .pantry-toggle .pchev,.qty-toggle[aria-expanded=true] .pchev{transform:rotate(180deg)}
.pantry-body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.pg h3{margin:16px 0 8px;color:var(--muted);font-size:14px;font-weight:600}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchips .chip{height:36px;padding:0 14px}
.pantry-actions{display:flex;gap:8px;margin-top:18px}
.qty{margin-top:18px;border-top:1px solid var(--line)}
.qty-toggle{height:50px;padding:0;font-size:16px}
.qty-toggle em{margin-left:4px;font-size:14px}
.qty-help{margin:0 0 6px;color:var(--muted);font-size:14px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-top:1px solid var(--line)}
.qrow .qn{font-size:16px;line-height:1.3}
.qrow .qn small{display:block;color:var(--muted);font-size:13px}
.qrow .amt span{min-width:26px}
.res-h{display:flex;align-items:baseline;gap:8px;margin:28px 0 10px;font-size:20px;font-weight:650;letter-spacing:-.015em}
.res-h span{color:var(--muted);font-size:15px;font-weight:500}
.res-empty{margin:0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:15px}
.mine-h{margin:32px 0 10px;font-size:20px;font-weight:650;letter-spacing:-.015em}
.mine-empty{margin:0;padding:14px 0;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
.new-btn{margin-top:16px}
.home-foot{margin-top:28px;color:var(--muted);font-size:13px;line-height:1.5}

/* ---------- Subpáginas ---------- */
.sub-head{padding:calc(6px + var(--safe-t)) 0 4px}
.sub-head h1{margin:6px 0 0;font-size:30px;line-height:1.12;letter-spacing:-.02em;font-weight:700}

/* ---------- Bolo ---------- */
.ch{padding:calc(6px + var(--safe-t)) 0 0}
.ch .wrap{padding-bottom:0}
.ch-nav{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.ch-title{display:flex;align-items:flex-start;gap:14px;margin-top:8px}
.ch-title h1{margin:0 0 4px;font-size:28px;line-height:1.12;letter-spacing:-.02em;font-weight:700}
.ch-title p{margin:0;color:var(--muted);font-size:15px}
.facts{display:flex;margin-top:18px}
.facts div{flex:1;min-width:0;padding:0 12px;border-left:1px solid var(--line)}
.facts div:first-child{padding-left:0;border-left:0}
.facts small{display:block;color:var(--muted);font-size:13px}
.facts strong{display:block;font-size:18px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.cfg{margin-top:18px}
.cfg-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:9px 14px 9px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.cfg-row:first-child{border-top:0}
.cfg-row:active{background:var(--press)}
.cfg-row .k{flex:none;width:84px;color:var(--muted);font-size:15px}
.cfg-row .v{flex:1;min-width:0;font-size:16px;font-weight:600}
.cfg-row .v small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.cfg-row .chev{color:var(--muted)}
.fitline{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line);color:var(--ink2);font-size:14px}
.fit{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--ink2)}
.dot{flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--ok)}
.warn .dot{background:var(--warn)}
.fit .link{font-size:14px}
.tabs{position:sticky;top:0;z-index:5;margin:22px -20px 0;padding:8px 20px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.list-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 4px}
.list-tools .progress{color:var(--muted);font-size:14px}
.tool-btns{display:flex;gap:6px}
.grp{margin:22px 0 2px;color:var(--ink);font-size:15px;font-weight:650}
.grp small{margin-left:6px;color:var(--muted);font-weight:400}
.ing-row{border-bottom:1px solid var(--line)}
.ing{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 0;border:0;background:none;text-align:left}
.ing:active{background:var(--press)}
.box{flex:none;width:24px;height:24px;margin-top:1px;display:grid;place-items:center;border:1.5px solid var(--line2);border-radius:50%;transition:background .15s,border-color .15s}
.box svg{width:12px;height:12px;opacity:0}
.ing[aria-checked=true] .box{background:var(--ok);border-color:var(--ok)}
.ing[aria-checked=true] .box svg{opacity:1}
.ing[aria-checked=true] .iname,.ing[aria-checked=true] .iq b{color:var(--muted)}
.ing[aria-checked=true] .iname{text-decoration:line-through;text-decoration-color:var(--line2)}
.iname{flex:1;padding-top:1px;font-size:16px;line-height:1.35}
.iname em{font-size:14px}
.iq{flex:none;max-width:52%;text-align:right}
.iq b{display:block;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.iq small{display:block;color:var(--muted);font-size:13px;line-height:1.3;white-space:nowrap}
.sub-btn{display:block;margin:-6px 0 0 36px;padding:2px 0 12px;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line2)}
.sub-txt{margin:-4px 0 12px 36px;padding:10px 12px;border-radius:var(--r-sm);background:var(--hl);color:var(--ink);font-size:15px}
.shop-btn{margin-top:22px}
.shop-in{display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:15px}
.shop-in>span{display:flex;flex:1;align-items:center;gap:8px;font-weight:600}
.shop-in>span svg{width:16px;height:16px;color:var(--ok)}
.shop-in a,.shop-in button{font-size:15px}
.note-call{margin-top:18px;padding:12px 14px;border-radius:var(--r-md);background:var(--hl)}
.note-call b{display:block;font-size:13px;font-weight:650}
.note-call p{margin:2px 0 0;color:var(--ink);font-size:16px;white-space:pre-line}
.steps{margin:18px 0 0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.steps .n{padding-top:1px;color:var(--muted);font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.steps .ph{grid-column:2;color:var(--muted);font-size:13px}
.steps h3{grid-column:2;margin:0;font-size:17px;font-weight:600}
.steps p{grid-column:2;margin:2px 0 0;color:var(--ink2);font-size:16px}
.steps .t{grid-column:2;margin-top:4px;color:var(--muted);font-size:14px}
b.q{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.tips{margin-top:24px}
.tips h3{margin:0 0 6px;font-size:17px;font-weight:650}
.tips ul{margin:0;padding-left:18px;color:var(--ink2);font-size:15px}
.tips li{margin:6px 0}
.notes{margin-top:18px}
.notes .lbl{display:block;font-size:17px;font-weight:650}
.notes textarea{display:block;width:100%;min-height:120px;margin-top:10px;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--surface);font-size:16px;line-height:1.5;resize:vertical}
.h3{margin:30px 0 4px;font-size:17px;font-weight:650}
.hist{padding:14px 0;border-bottom:1px solid var(--line)}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h-top b{font-size:16px;font-weight:600}
.mini-stars{color:var(--star);font-size:15px;letter-spacing:1px;white-space:nowrap}
.mini-stars i{font-style:normal;color:var(--line2)}
.hist p{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.hist .cap{margin-top:2px}
.hist .link{margin-top:6px;font-size:14px;color:var(--muted)}
.empty{margin:6px 0 0;color:var(--muted);font-size:15px}
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 20px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta{display:block;width:100%;max-width:520px;height:54px;margin:0 auto;border:0;border-radius:27px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:650}
.spacer{height:96px}

/* ---------- Folhas (bottom sheet) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:30}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;max-height:90vh;margin:0 auto;padding:0 20px calc(20px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:20px 20px 0 0;background:var(--bg);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.in .sheet-bg{opacity:1}
.sheet-wrap.in .sheet{transform:none}
.grab{width:36px;height:5px;margin:8px auto 0;border-radius:3px;background:var(--line2)}
.sh-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:6px 0;background:var(--bg)}
.sh-head h2{margin:0;font-size:20px;font-weight:700}
.sh-done{height:44px;padding:0 2px;border:0;background:none;color:var(--ink);font-size:17px;font-weight:600}
.sh-sub{margin:18px 0 6px;color:var(--muted);font-size:14px;font-weight:600}
.sh-q{margin:8px 0 4px;font-size:17px;font-weight:600}
.sh-body .seg{margin-top:6px}
.sh-body .btn{margin-top:10px}
.opts{overflow:hidden;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:16px}
.opt:first-child{border-top:0}
.opt:active{background:var(--press)}
.opt>span:first-child{flex:1}
.opt .ot b{display:block;font-weight:600}
.opt .ot small{display:block;margin-top:1px;color:var(--muted);font-size:14px}
.radio{flex:none;width:22px;height:22px;border:1.5px solid var(--line2);border-radius:50%}
.opt[aria-pressed=true] .radio{border:7px solid var(--ink)}
.tag{flex:none;padding:3px 8px;border-radius:10px;background:var(--hl);font-size:12px;font-weight:600}
.stars{display:flex;gap:4px;margin-left:-6px}
.star{width:46px;height:46px;display:grid;place-items:center;border:0;background:none;color:var(--line2)}
.star svg{width:30px;height:30px}
.star[aria-checked=true]{color:var(--star)}
.fin label{display:block;margin-top:18px}
.fin label>span:first-child{display:block;margin-bottom:6px;font-size:15px;font-weight:600}
.fin textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);font-size:16px;line-height:1.45}
.fin .amt{justify-content:flex-start}
.fin .actions{margin-top:20px}
.suggest{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--hl);font-size:15px}
.suggest p{margin:0 0 10px}
.suggest .row{display:flex;gap:8px}

/* ---------- Ajustes ---------- */
.set-sec{margin-top:28px}
.set-sec h2{margin:0 0 10px;font-size:20px;font-weight:650}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:58px;padding:12px 16px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row .t{flex:1;min-width:0}
.set-row .t b{display:block;font-size:16px;font-weight:550}
.set-row .t small{display:block;margin-top:2px;color:var(--muted);font-size:14px;line-height:1.4}
.stepper{display:flex;flex:none;gap:6px}
.stepper button{width:40px;height:40px;border:1px solid var(--line2);border-radius:20px;background:var(--surface);font-size:20px;line-height:1}
.stepper button:disabled{opacity:.35}
.howto{padding:4px 16px 16px;border-top:1px solid var(--line)}
.howto ol{margin:10px 0 0;padding-left:20px;color:var(--ink2);font-size:15px}
.howto li{margin:7px 0}
.howto b{color:var(--ink)}
.howto .btn{margin-top:14px}

/* ---------- Lista de compras ---------- */
.shop-cake{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.shop-cake .txt{flex:1;min-width:0}
.shop-cake b{display:block;font-size:16px;font-weight:600}
.shop-cake small{display:block;color:var(--muted);font-size:14px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;font-size:15px}
.switch-row small{display:block;color:var(--muted);font-size:13px}
.shop-actions{display:grid;gap:10px;margin-top:24px}
.from{display:block;margin-top:2px;color:var(--muted);font-size:13px}

/* ---------- Editor ---------- */
.ed-sec{margin-top:30px}
.ed-sec h2{margin:0 0 4px;font-size:20px;font-weight:650}
.fl{display:block;margin-top:14px}
.fl>span:first-child{display:block;margin-bottom:6px;color:var(--ink2);font-size:14px;font-weight:600}
.ed input:not([type]),.ed select,.ed textarea{width:100%;height:46px;padding:0 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);font-size:16px}
.ed select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.ed textarea{height:auto;padding:10px 12px;line-height:1.45;resize:vertical;transition:background .3s}
.ed textarea.flash{background:var(--hl)}
.ed input:disabled{opacity:.4}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio .fl>span:first-child{font-size:13px;white-space:nowrap}
.ed .amt{gap:6px}
.ed .amt input{text-align:right;font-weight:600}
.ed .amt span{min-width:0;font-size:15px}
.tones{display:flex;flex-wrap:wrap;gap:10px}
.tone{width:38px;height:38px;border:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tone[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.ed-ing{padding:12px 0;border-bottom:1px solid var(--line)}
.ed-ing-r{display:flex;align-items:center;gap:8px;margin-top:8px}
.ed .ed-ing-r .ed-q{flex:none;width:92px;height:44px;text-align:right;font-weight:600}
.ed .ed-ing-r select{min-width:0}
.ed .ed-ing-r select{flex:1;height:44px}
.ed-sec>.btn{margin-top:14px}
.tokens-wrap .pchips{margin-top:10px}
.ed-step{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.ed-step-h{display:flex;align-items:center;gap:8px}
.ed-step-h .n{flex:none;width:20px;color:var(--muted);font-weight:650}
.ed .ed-step-h input{flex:1;height:44px}
.ed-step textarea{margin-top:8px}
.ed-timer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;color:var(--ink2);font-size:15px}
.ed .ed-timer .amt input{width:80px;height:40px}
.errs{margin-top:26px;padding:14px 16px;border:1.5px solid var(--danger);border-radius:var(--r-md);font-size:15px}
.errs ul{margin:6px 0 0;padding-left:18px}
.ed-actions{display:grid;gap:10px;margin-top:26px}

/* ---------- Modo preparo ---------- */
.cook{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.cook-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(6px + var(--safe-t)) 10px 6px}
.cook-count{color:var(--muted);font-size:15px;font-weight:550}
.bar{height:3px;margin:0 20px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.cook-body{flex:1;width:100%;max-width:600px;margin:0 auto;padding:24px 24px 20px;overflow-y:auto}
.cook-ph{color:var(--muted);font-size:15px;font-weight:550}
.cook-body h2{margin:6px 0 14px;font-size:30px;line-height:1.12;letter-spacing:-.025em;font-weight:700}
.cook-body>p{margin:0;color:var(--ink2);font-size:20px;line-height:1.5}
.cook-body .note-call p{font-size:17px}
.mise{margin-top:8px}
.timer{margin-top:26px;padding:18px 18px 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.timer .lbl{color:var(--muted);font-size:14px}
.timer .clock{margin:2px 0 14px;font-size:56px;font-weight:600;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer.done .clock{color:var(--warn)}
.timer .via{margin:10px 0 0;color:var(--muted);font-size:14px}
.trow{display:flex;flex-wrap:wrap;gap:8px}
.tb{height:46px;padding:0 18px;border:1px solid var(--line2);border-radius:23px;background:none;font-size:16px;font-weight:600}
.tb.main{flex:1;border-color:var(--ink);background:var(--ink);color:var(--bg)}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin:10px 20px 0}
.mini button{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--hl);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cook-nav{display:flex;gap:10px;width:100%;max-width:600px;margin:0 auto;padding:12px 20px calc(12px + var(--safe-b))}
.cook-nav button{height:56px;border:1px solid var(--line2);border-radius:28px;background:none;font-size:17px;font-weight:650}
.cook-nav .prev{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.cook-nav .prev svg{width:9px;height:15px}
.cook-nav .prev:disabled{opacity:.35}
.cook-nav .next{flex:2;border-color:var(--ink);background:var(--ink);color:var(--bg)}

.ring{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--ink);color:var(--bg);text-align:center}
.ring .swatch{margin-bottom:18px}
.ring h2{margin:0 0 8px;font-size:34px;letter-spacing:-.02em}
.ring p{max-width:28ch;margin:0 0 30px;font-size:19px;opacity:.85}
.ring button{height:56px;padding:0 34px;border:0;border-radius:28px;background:var(--bg);color:var(--ink);font-size:18px;font-weight:700}
.ring button+button{margin-top:12px;border:1.5px solid var(--bg);background:transparent;color:var(--bg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.9}}
.ring{animation:pulse 1.2s ease-in-out infinite}
.toast{position:fixed;left:50%;top:calc(56px + var(--safe-t));z-index:50;max-width:calc(100% - 40px);padding:10px 16px;border-radius:20px;background:var(--ink);color:var(--bg);font-size:15px;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="cook" class="cook" hidden></div>
<div id="ring" class="ring" hidden></div>
<script>

  {id:'c24',   n:'Redonda 24 cm',       shape:'round',vol:.75,  area:.75,  dt:0},
  {id:'f22',   n:'Com furo 22 cm',      shape:'tube', vol:.8,   area:.6,   dt:5},

  {id:'f26',   n:'Com furo 26 cm',      shape:'tube', vol:1.2,  area:.85,  dt:8},

const ACU = (q,n) => ({id:'acucar', n:n||'Açúcar refinado', q, u:'g', s:'de açúcar', cup:180});
const OLEO = q => ({id:'oleo', n:'Óleo (girassol ou canola)', q, u:'ml', s:'de óleo'});
const LEITE = (q,s) => ({id:'leite', n:'Leite integral', q, u:'ml', s:s||'de leite'});

const CAKES = [
{ id:'cenoura', name:'Cenoura', tone:'#E07B2E', top2:'#4A2C1E', toneInk:'#fff',

  tips:['Pedaços de cenoura afundam e pesam a massa: bata até ficar realmente liso.','A farinha vai à mão, não no liquidificador.','Cobertura quente sobre bolo quente é o que forma a casquinha.']},

{ id:'banana', name:'Banana', tone:'#E3B23C', toneInk:'#2A2108',

{ id:'chocolate', name:'Chocolate', tone:'#5A3324', toneInk:'#fff',

function shortName(n){ return (n||'').replace(/( descascad| cru | sem | com | em | bem |\s*\(|,).*$/i,'').trim() }
function toCake(d){
  const ref = PAN(d.ref), k = 1/ref.vol, used = new Set();
  const ing = d.ing.map((x,n)=>{
    const opt = /opcional/i.test(x.n), p = opt ? null : detect(x.n);
    let id = x.id || 'i'+n; while(used.has(id)) id += 'x'; used.add(id);
    const def = (p && PDEF[p]) || {}, nm = shortName(x.n) || x.n;
    const i = {id, n:x.n.replace(/\s*\(opcional\)\s*/i,' ').trim(), q: x.u==='pitada' ? 1 : x.q*k, u:x.u, opt, p,
      cup: x.cup ?? def.cup, sp: x.sp ?? def.sp, each: x.each ?? def.each,
      s: x.s || (x.u==='un' ? nm.toLowerCase() : 'de ' + lowerFirst(nm)), s1:x.s1, r:x.r};
    if(p==='ovos' && x.u==='un'){ i.egg = true; i.s = x.s || 'ovos'; i.s1 = x.s1 || 'ovo' }
    return i;
  });
  const byName = {};
  d.ing.forEach((x,n)=>{ byName[x.n.toLowerCase().trim()] = ing[n].id; byName[ing[n].n.toLowerCase()] = ing[n].id });
  const steps = (d.steps||[]).filter(s=>(s.t||'').trim() || (s.d||'').trim()).map(s=>({
    t: (s.t||'').trim() || 'Passo',
    d: esc(s.d||'').replace(/\[([^\]]+)\]/g, (m,n)=>{ const id = byName[n.toLowerCase().trim()]; return id ? '{'+id+'}' : n }),
    timer: s.timer || 0 }));
  const common = ['ovos','farinha','acucar','oleo','leite','fermento','manteiga'];
  const keyIng = ing.find(i=>i.p && !common.includes(i.p) && (i.u==='g'||i.u==='ml')) || ing.find(i=>i.u==='g'||i.u==='ml') || ing[0];
  return {id:d.id, custom:true, ref:d.ref, from:d.from, name:d.name, desc:d.desc||'', tone:d.tone||TONES[0], temp:+d.temp||180,
    bake:[+d.bake[0]||30, Math.max(+d.bake[1]||0, +d.bake[0]||30)], key:keyIng && keyIng.id, tops:(d.tops && d.tops.length ? d.tops : ['nenhuma']),
    ing, steps, tips:(d.tips||'').split('\n').map(x=>x.trim()).filter(Boolean), done:d.done, cool:d.cool, noLeaven:d.noLeaven, refDt:ref.dt};
}

function S(c){
  if(!DB.cakes[c.id]) DB.cakes[c.id] = {mode:'forma', pan:c.ref||'r2030', panManual:false, base:c.key, amt:null, top:c.tops[0]||'nenhuma', checks:{}, note:'', tab:'ing'};
  return DB.cakes[c.id];
}

   ========================================================= */
const scalable = i => i.u==='g' || i.u==='ml' || i.u==='un';
function calc(c){
  const st = S(c);
  let pan = PAN(st.pan), f = pan.vol, fill = 1, suggested = null, baseIng = null;
  if(st.mode === 'ing'){
    baseIng = c.ing.find(i=>i.id===st.base && scalable(i)) || c.ing.find(i=>i.id===c.key && scalable(i)) || c.ing.find(scalable);
    const amt = Number(st.amt);
    f = amt > 0 && baseIng ? amt / baseIng.q : 1;
    suggested = PANS.reduce((a,p)=> Math.abs(Math.log(p.vol/f)) < Math.abs(Math.log(a.vol/f)) ? p : a);
    if(!st.panManual) pan = suggested;
    fill = f / pan.vol;
  }
  const O = DB.prefs.oven, dt = pan.dt - (c.refDt||0);
  let [a,b] = c.bake; a += dt; b += dt;
  if(fill > 1.12){ a += 5; b += 5 } else if(fill < .88){ a -= 5; b -= 5 }
  a += O.time; b += O.time;
  return {f, ft:pan.area, pan, fill, suggested, baseIng, time:[Math.max(10,a), Math.max(15,b)], dial: c.temp - (O.fan?20:0) - O.temp};
}

const FR = {0:'',25:'¼',50:'½',75:'¾'};
function frac(x, step=.25){
  const r = Math.round(x/step)*step, w = Math.floor(r + 1e-9), p = Math.round((r-w)*100);
  if(w===0 && p===0) return '0';
  return (w ? String(w) : '') + (FR[p]||'');
}
function nf(x){ return x.toLocaleString('pt-BR') }
function roundQ(q){ return q < 20 ? Math.round(q) : Math.round(q/5)*5 }

function fmt(ing, k){
  const raw = (ing.q||1) * (ing.u==='pitada' ? 1 : k);
  if(ing.u==='pitada') return {main:'1 pitada'};
  if(ing.u==='cc' || ing.u==='cs'){
    const v = Math.max(.25, Math.round(raw*4)/4);
    return {main: frac(v) + (v>1 ? ' colheres de ' : ' colher de ') + (ing.u==='cc' ? 'chá' : 'sopa')};
  }
  if(ing.u==='xic'){ const v = Math.max(.25, Math.round(raw*4)/4); return {main: frac(v) + (v>1.12 ? ' xícaras' : ' xícara')} }
  if(ing.u==='un'){
    const step = ing.r || 1, n = Math.max(1, Math.round(raw/step)*step);
    const out = {main: nf(n) + ' ' + (n===1 ? (ing.s1||ing.s) : ing.s), n};
    if(ing.egg){
      const d = raw - n, conta = nf(Math.round(raw*10)/10);
      if(d >= .25) out.hint = `Use grandes (conta: ${conta})`;
      else if(d <= -.25) out.hint = `Use médios (conta: ${conta})`;
    }
    return out;
  }
  const q = Math.max(1, roundQ(raw)), unit = ing.u, out = {main: nf(q) + ' ' + unit, q};
  if(DB.prefs.home){
    if(ing.each){
      const n = Math.round(q/ing.each.g*2)/2;
      if(n >= .5) out.hint = '≈ ' + frac(n,.5) + ' ' + (n>1 ? ing.each.many : ing.each.one);
    } else if(unit==='ml'){
      out.hint = q >= 60 ? '≈ ' + frac(q/240) + ' xícara' + (q/240 > 1.12 ? 's' : '') : '≈ ' + frac(q/15,.5) + ' colher' + (q/15 > 1.25 ? 'es' : '') + ' de sopa';
    } else if(ing.cup && q >= ing.cup*.25){
      const x = q/ing.cup; out.hint = '≈ ' + frac(x) + ' xícara' + (x > 1.12 ? 's' : '');
    } else if(ing.sp){
      const x = Math.max(.5, Math.round(q/ing.sp*2)/2); out.hint = '≈ ' + frac(x,.5) + ' colher' + (x>1 ? 'es' : '') + ' de sopa';
    }
  }
  return out;
}
const qMain = (i, r) => i.u==='un' ? nf(r.n) : r.main;
function inline(ing, k){ const r = fmt(ing,k); return ing.u==='un' ? `<b class="q">${r.main}</b>` : `<b class="q">${r.main}</b> ${ing.s}` }
function render_text(txt, c, cc, extra){
  return txt.replace(/\{(\w+)\}/g, (m,id)=>{
    if(id==='time') return `<b class="q">${cc.time[0]} a ${cc.time[1]} min</b>`;
    let i = c.ing.find(x=>x.id===id); if(i) return inline(i, cc.f);
    i = extra && extra.ing.find(x=>x.id===id); if(i) return inline(i, cc.ft);
    return m;
  });
}

/* Passo a passo completo: separar → forno → massa → assar → cobertura → finalização */
function buildSteps(c, cc, top){
  const out = [], O = DB.prefs.oven;
  const P = (ph, s, extra, more) => out.push(Object.assign({ph, t:s.t, d:render_text(s.d,c,cc,extra), timer:s.timer||0}, more||{}));
  const unmold = ['tube','round','loaf'].includes(cc.pan.shape);
  P('Antes de começar', {t:'Separe tudo', d: c.ing.some(i=>i.egg)
    ? 'Marque cada ingrediente ao separar. Deixe os ovos fora da geladeira: em temperatura ambiente, a massa cresce melhor.'
    : 'Marque cada ingrediente ao separar.'}, null, {mise:true});
  const adj = cc.dial !== c.temp ? ` A receita pede ${c.temp} °C; o valor já está ajustado ao seu forno.` : ` Se o forno tiver ventilação, use ${c.temp-20} °C.`;
  P('Antes de começar', {t:'Forno e forma', d:`Preaqueça o forno a <b class="q">${cc.dial} °C</b>.${adj} Unte a forma ${lowerFirst(cc.pan.n)} com manteiga e polvilhe farinha, batendo o excesso.`});
  c.steps.forEach(s=>P('Massa', s));
  const tAdj = O.time ? ` O tempo já inclui ${O.time>0?'+':'−'}${Math.abs(O.time)} min do ajuste do seu forno.` : '';
  P('Forno', {t:'Asse', d:`Asse por {time}. Não abra o forno nos primeiros 20 minutos. ${c.done || 'Está pronto quando dourar e um palito espetado no centro sair limpo.'}${tAdj}`, timer:cc.time[0]*60}, null, {bake:true});
  const during = top.when==='quente' || top.when==='morno';
  if(during) top.prep.forEach(s=>P('Cobertura, enquanto o bolo assa', s, top));
  if(top.when==='quente'){
    P('Finalização', {t:'Cubra o bolo', d:(unmold ? 'Espere 5 minutos, desenforme num prato e, ainda quente: ' : '') + top.apply, timer: c.cool ? 0 : (top.applyTimer||0)}, top);
    if(c.cool) P('Descanso', c.cool);
    return out;
  }
  if(c.cool) P('Descanso', c.cool);
  if(top.when==='none'){
    if(!c.cool) P('Descanso', {t:'Deixe amornar', d: unmold ? 'Espere 15 minutos na forma, passe uma faca nas bordas e desenforme num prato.' : 'Espere 15 minutos antes de cortar. Pode servir na própria forma.', timer:900});
    return out;
  }
  if(top.when==='morno'){
    if(!c.cool) P('Descanso', {t:'Deixe amornar', d: unmold ? 'Espere 15 minutos na forma, passe uma faca nas bordas e desenforme num prato.' : 'Espere 15 minutos. Pode cobrir na própria forma.', timer:900});
    P('Finalização', {t:'Cubra o bolo', d:top.apply, timer:top.applyTimer||0}, top);
  } else {
    if(!c.cool) P('Descanso', {t:'Deixe esfriar', d:(unmold ? 'Espere 15 minutos, desenforme num prato e deixe' : 'Deixe o bolo') + ' esfriar por completo. Cobertura sobre bolo quente derrete e escorre.', timer:3600});
    top.prep.forEach(s=>P('Cobertura', s, top));
    P('Finalização', {t:'Cubra o bolo', d:top.apply, timer:top.applyTimer||0}, top);
  }
  return out;
}

const hist = id => DB.history.filter(e=>e.cake===id);
function relTime(ts){
  const day = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime() };
  const n = Math.round((day(Date.now()) - day(ts)) / 864e5);
  if(n<=0) return 'hoje'; if(n===1) return 'ontem'; if(n<7) return `há ${n} dias`;
  if(n<30){ const w = Math.floor(n/7); return `há ${w} semana${w>1?'s':''}` }
  if(n<365){ const m = Math.floor(n/30); return `há ${m} ${m>1?'meses':'mês'}` }
  return 'há mais de um ano';
}
function histMeta(id){ const h = hist(id); if(!h.length) return ''; return `${h.length} ${h.length>1?'fornadas':'fornada'}, a última ${relTime(h[h.length-1].at)}` }
function ovenSuggestion(){
  const h = DB.history.filter(e=>e.actual>0 && e.exp && e.at > DB.prefs.oven.changedAt).slice(-2);
  if(h.length < 2) return 0;
  const over = h.map(e=>e.actual - e.exp[1]), under = h.map(e=>e.exp[0] - e.actual);
  if(over.every(x=>x>=3)) return Math.round((over[0]+over[1])/2);
  if(under.every(x=>x>=3)) return -Math.round((under[0]+under[1])/2);
  return 0;
}
function applyOvenTime(v){ const O = DB.prefs.oven; O.time = Math.max(-15, Math.min(25, v)); O.changedAt = Date.now(); save() }

const PANS_BY_VOL = [...PANS].sort((x,y)=>y.vol-x.vol);
function needMap(list){
  const m = {};
  for(const [i,t,k] of list){
    const p = pid(i,t); if(!p) continue;
    m[p] = (m[p]||0) + (i.u===punit(p) ? i.q*k : 0);
  }
  return m;
}
function needAt(x, base, k){ return punit(x)==='un' ? Math.max(1, Math.round(base*k)) : base*k*.95 }
function avail(c, have, qty){
  const mass = needMap(c.ing.map(i=>[i,null,1]));
  const miss = Object.keys(mass).filter(x=>!have.has(x));
  const swaps = miss.filter(x=>{ const s = SUBS[x]; return s && s.need && (s.need==='agua' || have.has(s.need)) });
  const limited = Object.entries(mass).filter(([x,n])=>have.has(x) && qty[x]>0 && n>0);
  const fails = pan => limited.filter(([x,n])=>needAt(x,n,pan.vol) > qty[x]);
  const st = DB.cakes[c.id], pref = PAN(st && st.mode==='forma' ? st.pan : (c.ref||'r2030'));
  let pan = null, lim = null;
  if(!fails(pref).length) pan = pref;
  else {
    const f = fails(pref); lim = f.reduce((a,b)=> qty[b[0]]/b[1] < qty[a[0]]/a[1] ? b : a)[0];
    pan = PANS_BY_VOL.find(p=>p.vol < pref.vol && !fails(p).length) || null;
  }
  const smallest = PANS_BY_VOL[PANS_BY_VOL.length-1];
  const short = pan ? [] : fails(smallest).map(([x,n])=>({x, need: punit(x)==='un' ? needAt(x,n,smallest.vol) : n*smallest.vol}));
  const tops = !pan ? [] : c.tops.filter(id=>{
    if(id==='nenhuma') return false;
    const tn = needMap(TOP(id).ing.map(i=>[i,id,pan.area]));
    return Object.entries(tn).every(([x,n])=> have.has(x) && !(qty[x]>0 && ((mass[x]||0)*pan.vol + n)*.95 > qty[x]));
  });
  return {miss, swaps, short, pan, pref, lim, tops};
}

          ${on ? '<button class="tbtn" data-act="pclear">Limpar tudo</button>' : ''}
        </div>
        ${qBlock}
      </div>
    </section>
    ${list}
    <a class="btn secondary block new-btn" href="#/nova">${ICON.plus}Nova receita</a>
    <p class="home-foot">Quantidades calibradas para forma retangular 20×30 cm e recalculadas para a sua forma. Medidas em gramas e mililitros; a medida caseira aparece como referência.${on ? ' Sal, água e ingredientes opcionais não entram no filtro.' : ''} Tudo fica salvo só neste aparelho.</p>
  </div>`;

  const rerender = () => { save(); const y = scrollY; renderHome(); scrollTo(0,y) };
  $('#app').onclick = e=>{
    const a = e.target.closest('a[data-pan]');
    if(a){ const c = CAKE(a.dataset.cake), st = S(c); st.mode = 'forma'; st.pan = a.dataset.pan; st.panManual = false; save(); return }
    const b = e.target.closest('button'); if(!b) return;
    const set = new Set(DB.prefs.pantry || []); DB.prefs.qty = DB.prefs.qty || {};
    if(b.dataset.p){ const id = b.dataset.p; if(set.has(id)){ set.delete(id); delete DB.prefs.qty[id] } else set.add(id) }
    else if(b.dataset.act==='ptoggle') DB.prefs.pantryOpen = !DB.prefs.pantryOpen;
    else if(b.dataset.act==='qtoggle') DB.prefs.qtyOpen = !DB.prefs.qtyOpen;
    else if(b.dataset.act==='pbasics'){ const all = BASICS.every(x=>set.has(x)); BASICS.forEach(x=>{ if(all){ set.delete(x); delete DB.prefs.qty[x] } else set.add(x) }) }
    else if(b.dataset.act==='pclear'){ set.clear(); DB.prefs.qty = {} }
    else return;
    DB.prefs.pantry = [...set]; rerender();
  };
  document.querySelectorAll('[data-q]').forEach(inp=>{
    inp.onchange = ()=>{ const v = num(inp.value); DB.prefs.qty = DB.prefs.qty || {}; if(v>0) DB.prefs.qty[inp.dataset.q] = v; else delete DB.prefs.qty[inp.dataset.q]; rerender() };
    inp.onkeydown = e=>{ if(e.key==='Enter') inp.blur() };
  });
}

const OPEN_SUB = new Set();
let CONFIRM = null;
function ingRow(g, i, k, st, topId){
  const r = fmt(i,k), key = g + i.id, on = !!st.checks[key], p = pid(i,topId), sub = SUBS[p];
  const subOK = sub && (i.u==='g' || i.u==='ml' || i.u==='un'), open = OPEN_SUB.has(key);
  const qv = roundQ(i.q*k);
  return `<div class="ing-row">
    <button class="ing" role="checkbox" aria-checked="${on}" data-chk="${key}">
      <span class="box">${ICON.check}</span>
      <span class="iname">${esc(i.n)}${i.opt ? ' <em>opcional</em>' : ''}</span>
      <span class="iq"><b>${qMain(i,r)}</b>${r.hint ? `<small>${r.hint}</small>` : ''}</span>
    </button>
    ${subOK ? `<button class="sub-btn" data-sub="${key}" aria-expanded="${open}">${open ? 'Ocultar troca' : 'Não tem? Veja a troca'}</button>${open ? `<p class="sub-txt">${sub.txt(qv)}</p>` : ''}` : ''}
  </div>`;
}
function ingList(c, cc, top, st){
  return `<div class="grp">Massa</div>${c.ing.map(i=>ingRow('m',i,cc.f,st,null)).join('')}`
    + (top.ing.length ? `<div class="grp">Cobertura <small>${top.name}</small></div>${top.ing.map(i=>ingRow('c',i,cc.ft,st,top.id)).join('')}` : '');
}
function ingClick(b, c){
  const st = S(c);
  if(b.dataset.chk){ st.checks[b.dataset.chk] = !st.checks[b.dataset.chk]; save(); return true }
  if(b.dataset.sub){ const k = b.dataset.sub; OPEN_SUB.has(k) ? OPEN_SUB.delete(k) : OPEN_SUB.add(k); return true }

}
const noteCall = note => note ? `<div class="note-call"><b>Sua nota</b><p>${esc(note)}</p></div>` : '';
function fitNote(cc){
  const pct = Math.round(cc.fill*100), s = cc.suggested;
  if(cc.fill >= .88 && cc.fill <= 1.12) return `<div class="fit"><span class="dot"></span><span>Medida certa para esta forma.</span></div>`;
  const msg = cc.fill < .88 ? `Massa pouca para esta forma (${pct}% do ideal): o bolo fica baixo e resseca.` : `Massa demais para esta forma (${pct}% do ideal): pode transbordar e ficar cru no centro.`;
  return `<div class="fit warn"><span class="dot"></span><span>${msg}${s && s.id!==cc.pan.id ? ` <button class="link" data-act="usepan" data-pan="${s.id}">Usar ${lowerFirst(s.n)}</button>` : ''}</span></div>`;
}

function bindCake(c){
  const st = S(c), app = $('#app');
  const re = () => { save(); rerenderCake(c) };
  app.onclick = e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(ingClick(b,c)) return re();
    if(b.dataset.tab){ st.tab = b.dataset.tab; CONFIRM = null; return re() }
    if(b.dataset.del){
      if(CONFIRM===b.dataset.del){ DB.history = DB.history.filter(e=>e.id!==b.dataset.del); CONFIRM = null; toast('Fornada apagada') }
      else CONFIRM = b.dataset.del;
      return re();
    }
    switch(b.dataset.act){
      case 'home': location.hash = '#/'; break;
      case 'pan': openPanSheet(c); break;
      case 'top': openTopSheet(c); break;
      case 'clear': st.checks = {}; re(); break;
      case 'share': shareList(c); break;
      case 'shop':
        if(DB.shop.items.includes(c.id)){ DB.shop.items = DB.shop.items.filter(x=>x!==c.id); toast('Removido da lista de compras') }
        else { DB.shop.items.push(c.id); toast('Adicionado à lista de compras') }
        re(); break;
      case 'cook': unlockAudio(); location.hash = `#/${c.id}/preparo/${resumeIdx(c) ?? 0}`; break;
    }
  };
  const note = $('#note');
  if(note){
    let t;
    note.oninput = ()=>{ clearTimeout(t); t = setTimeout(()=>{ st.note = note.value; st.noteAt = Date.now(); save(); const p = $('#note-at'); if(p) p.textContent = 'Salva em ' + new Date(st.noteAt).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) }, 400) };
  }
}

function shareText(txt){

function shopData(){
  const have = new Set(DB.prefs.pantry || []), qty = DB.prefs.qty || {}, agg = new Map();
  const cakes = DB.shop.items.map(CAKE).filter(Boolean);
  for(const c of cakes){
    const st = S(c), cc = calc(c), top = TOP(st.top);
    const add = (i,k,t)=>{
      if(i.u==='pitada') return;
      const p = pid(i,t); if(!p && /^(sal|água|agua)\b/i.test(i.n)) return;
      const key = (p || i.n.toLowerCase()) + '|' + i.u;
      let e = agg.get(key);
      if(!e){ e = {key, p, n: p ? PNAME[p] : i.n, opt:!!i.opt, u:i.u, q:0, ing:i, from:[]}; agg.set(key, e) }
      e.q += i.q*k; if(!i.opt) e.opt = false;
      if(!e.from.includes(c.name)) e.from.push(c.name);
    };
    c.ing.forEach(i=>add(i,cc.f,null)); top.ing.forEach(i=>add(i,cc.ft,top.id));
  }
  const rows = [], hidden = [];
  for(const e of agg.values()){
    let need = e.q, note = '';
    if(DB.shop.hideHave && e.p && have.has(e.p)){
      const h = qty[e.p];
      if(h > 0 && e.u===punit(e.p)){
        need = (e.u==='un' ? Math.round(e.q) : e.q) - h;
        if(need <= (e.u==='un' ? 0 : e.q*.05)){ hidden.push(e); continue }
        note = `tem ${qtyTxt(e.p, h)}`;
      } else { hidden.push(e); continue }
    }
    rows.push(Object.assign({}, e, {need, note}));
  }
  const ord = e => { const i = PORDER.indexOf(e.p); return i<0 ? 999 : i };
  rows.sort((a,b)=>ord(a)-ord(b));
  return {cakes, rows, hidden};
}
function renderShop(){

    ${cakes.map(c=>{ const st = S(c), cc = calc(c); return `<div class="shop-cake">${swatch(c)}<a class="txt" href="#/${c.id}" style="text-decoration:none"><b>${esc(title(c))}</b><small>Forma ${lowerFirst(cc.pan.n)}, ${lowerFirst(TOP(st.top).name)}</small></a>

      <button class="switch" role="switch" aria-checked="${DB.shop.hideHave}" data-act="have" aria-label="Descontar o que tem em casa"></button></div>
    <div class="grp">Comprar <small>${rows.length} ${rows.length===1 ? 'item' : 'itens'}</small></div>
    ${rows.length ? rows.map(rowHTML).join('') : '<p class="empty">Você já tem tudo em casa.</p>'}
    ${hidden.length ? `<p class="cap">Não aparecem porque você tem em casa: ${esc(join(hidden.map(e=>lowerFirst(e.n))))}.</p>` : ''}
    <div class="shop-actions">
      <button class="btn primary block" data-act="send">Enviar lista</button>
      <button class="btn ghost block" data-act="clearshop">Limpar lista</button>
    </div>`}
  </div>`;

      case 'home': location.hash = '#/'; break;
      case 'have': DB.shop.hideHave = !DB.shop.hideHave; re(); break;
      case 'clearshop': DB.shop = {items:[], checks:{}, hideHave:DB.shop.hideHave}; re(); toast('Lista limpa'); break;
      case 'send': {
        const {rows} = shopData(), left = rows.filter(e=>!ch[e.key]);

        shareText(txt); break;
      }
    }
  };
}

function drawKeep(){ const y = scrollY; drawEditor(); scrollTo(0,y) }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') }
function bindEditor(){
  const app = $('#app'), d = ED.d;
  app.oninput = e=>{
    const t = e.target;
    if(t.dataset.f){ const f = t.dataset.f;
      if(f==='b0') d.bake[0] = num(t.value); else if(f==='b1') d.bake[1] = num(t.value); else if(f==='temp') d.temp = num(t.value); else d[f] = t.value }
    else if(t.dataset.i!=null){ const x = d.ing[+t.dataset.i];
      if(t.dataset.k==='q') x.q = num(t.value);
      else if(t.dataset.k==='n'){ if(x._old==null) x._old = x.n; x.n = t.value } }
    else if(t.dataset.s!=null){ const s = d.steps[+t.dataset.s];
      if(t.dataset.k==='timer') s.timer = Math.round(num(t.value)*60); else s[t.dataset.k] = t.value }
  };
  app.onchange = e=>{
    const t = e.target;
    if(t.dataset.f==='ref') d.ref = t.value;
    if(t.dataset.i!=null && t.dataset.k==='u'){ d.ing[+t.dataset.i].u = t.value; drawKeep(); return }
    if(t.dataset.i!=null && t.dataset.k==='n'){
      const x = d.ing[+t.dataset.i], old = (x._old||'').trim(), nw = (x.n||'').trim();
      if(old && nw && old!==nw){
        const re = new RegExp('\\[' + escRe(old) + '\\]', 'gi');
        d.steps.forEach(s=>{ s.d = (s.d||'').replace(re, '[' + nw + ']') });
        app.querySelectorAll('textarea[data-k="d"]').forEach(ta=>{ ta.value = d.steps[+ta.dataset.s].d });
      }
      delete x._old;
      app.querySelector('.tokens-wrap').innerHTML = tokensHTML();
    }
  };
  app.onclick = e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.tone){ d.tone = b.dataset.tone; app.querySelectorAll('.tone').forEach(x=>x.setAttribute('aria-pressed', x.dataset.tone===d.tone)); return }
    if(b.dataset.tp){ const id = b.dataset.tp; d.tops = d.tops.includes(id) ? d.tops.filter(x=>x!==id) : [...d.tops, id]; b.setAttribute('aria-pressed', d.tops.includes(id)); return }
    if(b.dataset.tok!=null){ insertTok(b.dataset.tok); return }
    if(b.dataset.rmi!=null){ d.ing.splice(+b.dataset.rmi,1); if(!d.ing.length) d.ing.push({n:'',q:0,u:'g'}); return drawKeep() }
    if(b.dataset.rms!=null){ d.steps.splice(+b.dataset.rms,1); if(!d.steps.length) d.steps.push({t:'',d:'',timer:0}); ED.lastTA = null; return drawKeep() }
    switch(b.dataset.act){
      case 'cancel': ED = null; if(history.length > 1) history.back(); else location.hash = '#/'; break;
      case 'addi': d.ing.push({n:'',q:0,u:'g'}); drawKeep(); { const ins = app.querySelectorAll('.ed-name'); ins[ins.length-1].focus() } break;
      case 'adds': d.steps.push({t:'',d:'',timer:0}); drawKeep(); break;
      case 'save': saveDraft(); break;
      case 'del': if(!ED.confirmDel){ ED.confirmDel = true; drawKeep() } else deleteCustom(d.id); break;
    }
  };
}
document.addEventListener('focusin', e=>{ if(ED && e.target.matches && e.target.matches('textarea[data-k="d"]')) ED.lastTA = +e.target.dataset.s });
document.addEventListener('focusout', e=>{ if(ED && e.target.matches && e.target.matches('textarea[data-k="d"]')){ ED.caret = e.target.selectionStart; ED.caretIdx = +e.target.dataset.s } });
function insertTok(n){
  const d = ED.d;
  let idx = ED.lastTA; if(idx==null || !d.steps[idx]) idx = d.steps.length - 1;
  const s = d.steps[idx]; s.d = s.d || '';
  const pos = ED.caretIdx===idx && ED.caret!=null ? Math.min(ED.caret, s.d.length) : s.d.length;
  const pre = s.d.slice(0,pos), post = s.d.slice(pos), tok = '[' + n + ']', sp = pre && !/\s$/.test(pre) ? ' ' : '';
  s.d = pre + sp + tok + post; ED.caret = (pre + sp + tok).length; ED.caretIdx = idx; ED.lastTA = idx;
  const ta = document.querySelector(`textarea[data-s="${idx}"][data-k="d"]`);
  if(ta){ ta.value = s.d; ta.classList.add('flash'); setTimeout(()=>ta.classList.remove('flash'), 500) }
}
function saveDraft(){
  const d = ED.d, errs = [];
  const name = (d.name||'').trim(); if(!name) errs.push('Dê um nome à receita.');
  const ing = d.ing.filter(x=>(x.n||'').trim() || x.q > 0);
  ing.forEach(x=>{ if(!(x.n||'').trim()) errs.push('Há uma quantidade sem o nome do ingrediente.'); else if(x.u!=='pitada' && !(x.q > 0)) errs.push(`Falta a quantidade de ${esc(x.n.trim())}.`) });
  if(!ing.length) errs.push('Adicione pelo menos um ingrediente.');
  const steps = d.steps.filter(s=>(s.t||'').trim() || (s.d||'').trim());
  if(!steps.length) errs.push('Escreva pelo menos um passo do preparo.');
  if(!(d.temp >= 100 && d.temp <= 280)) errs.push('Confira a temperatura do forno: entre 100 e 280 °C.');
  if(!(d.bake[0] > 0)) errs.push('Informe o tempo mínimo de forno.');
  else if(!(d.bake[1] >= d.bake[0])) errs.push('O tempo máximo precisa ser igual ou maior que o mínimo.');
  if(errs.length){ ED.errs = [...new Set(errs)]; drawKeep(); const el = $('.errs'); if(el) el.scrollIntoView({block:'center'}); return }
  const used = new Set();
  const out = {id: d.id || 'u' + Date.now().toString(36), from:d.from || null, name, desc:(d.desc||'').trim(), tone:d.tone, ref:d.ref, temp:d.temp, bake:[d.bake[0], d.bake[1]],
    ing: ing.map(x=>{
      let id = x.id || 'i' + Math.random().toString(36).slice(2,7); while(used.has(id)) id += 'x'; used.add(id);
      const o = {id, n:x.n.trim(), q: x.u==='pitada' ? 1 : x.q, u:x.u};
      if(x.n0 && x.n0.trim()===o.n) ['s','s1','r','cup','sp','each'].forEach(k=>{ if(x[k]!=null) o[k] = x[k] });
      return o;
    }),
    steps: steps.map(s=>({t:(s.t||'').trim(), d:(s.d||'').trim(), timer:s.timer || 0})),
    tops: d.tops.length ? d.tops : ['nenhuma'], tips:(d.tips||'').trim(), done:d.done, cool:d.cool, noLeaven:d.noLeaven, updated:Date.now()};
  Object.keys(out).forEach(k=>{ if(out[k]===undefined) delete out[k] });
  const i = DB.custom.findIndex(x=>x.id===out.id);
  if(i >= 0) DB.custom[i] = out; else DB.custom.push(out);
  invalidate(); save(); ED = null;
  location.replace('#/' + out.id); toast('Receita salva');
}
function deleteCustom(id){
  DB.custom = DB.custom.filter(x=>x.id!==id); delete DB.cakes[id];
  DB.shop.items = DB.shop.items.filter(x=>x!==id);
  Object.keys(DB.timers).filter(k=>k.startsWith(id+':')).forEach(k=>delete DB.timers[k]);
  invalidate(); save(); ED = null;
  location.replace('#/'); toast('Receita excluída');
}

let COOK = null, wakeLock = null;
function resumeIdx(c){ const st = S(c); return st.cookAt!=null && Date.now() - st.cookTs < 6*3600e3 ? st.cookAt : null }
function openCook(c, idx){
  const st = S(c), cc = calc(c), top = TOP(st.top), steps = buildSteps(c, cc, top);
  idx = Math.min(Math.max(0, idx), steps.length - 1);
  COOK = {c, cc, top, steps, idx}; st.cookAt = idx; st.cookTs = Date.now(); save();
  $('#cook').hidden = false; document.body.style.overflow = 'hidden';
  if(DB.prefs.wake) requestWake();
  drawCook();
}
function closeCook(){
  if(!COOK) return;
  COOK = null; $('#cook').hidden = true; document.body.style.overflow = ''; releaseWake();
}
function drawCook(){
  const {c, cc, top, steps, idx} = COOK, s = steps[idx], key = c.id + ':' + idx, st = S(c), last = idx===steps.length-1;
  const others = Object.entries(DB.timers).filter(([k])=>k.startsWith(c.id+':') && k!==key && steps[+k.split(':')[1]]);
  $('#cook').innerHTML = `
    <div class="cook-top">
      <button class="icon-btn" data-act="x" aria-label="Sair do preparo">${ICON.close}</button>
      <span class="cook-count num">Passo ${idx+1} de ${steps.length}</span>
      <button class="icon-btn" data-act="ings" aria-label="Ver ingredientes">${ICON.list}</button>
    </div>
    <div class="bar"><i style="width:${(idx+1)/steps.length*100}%"></i></div>
    ${others.length ? `<div class="mini">${others.map(([k,t])=>`<button data-go="${k.split(':')[1]}">${esc(steps[+k.split(':')[1]].t)}: <span data-clock="${k}">${mm(remain(t))}</span></button>`).join('')}</div>` : ''}
    <div class="cook-body">
      <div class="cook-ph">${s.ph}</div>
      <h2>${esc(s.t)}</h2>
      <p>${s.d}</p>
      ${s.mise ? `<div class="mise">${ingList(c, cc, top, st)}</div>` : ''}
      ${(s.mise || s.bake) ? noteCall(st.note) : ''}
      ${s.timer ? timerBlock(key, s) : ''}
    </div>
    <div class="cook-nav">
      <button class="prev" data-act="prev" ${idx===0 ? 'disabled' : ''}>${ICON.back}Voltar</button>
      <button class="next" data-act="next">${last ? 'Concluir' : 'Próximo passo'}</button>
    </div>`;
}
function timerBlock(key, s){
  const T = DB.timers[key], r = T ? remain(T) : s.timer, done = T && !T.paused && r <= 0;
  const state = !T ? 'idle' : T.paused ? 'paused' : done ? 'done' : 'run';
  const add = s.bake ? 5 : 1;
  const viaClock = DB.prefs.alarm && s.timer >= ALARM_MIN;
  return `<div class="timer ${done ? 'done' : ''}">
    <div class="lbl">${s.bake ? 'Forno: confira no mínimo do tempo' : 'Timer'}</div>
    <div class="clock" data-clock="${key}">${mm(r)}</div>
    <div class="trow">
      ${state==='idle' ? `<button class="tb main" data-act="tstart">Iniciar ${durLabel(s.timer)}</button>` : ''}
      ${state==='run' ? `<button class="tb main" data-act="tpause">Pausar</button><button class="tb" data-act="tadd">+${add} min</button>` : ''}
      ${state==='paused' ? `<button class="tb main" data-act="tresume">Continuar</button><button class="tb" data-act="treset">Zerar</button>` : ''}
      ${state==='done' ? `<button class="tb main" data-act="tadd">+${add} min</button><button class="tb" data-act="treset">Zerar</button>` : ''}
      ${s.bake && (state==='run' || state==='paused') ? `<button class="tb" data-act="tready" style="flex-basis:100%">Já está pronto</button>` : ''}
    </div>
    ${viaClock ? `<p class="via">Também toca no Relógio do iPhone.</p>` : ''}
  </div>`;
}
function cookClick(e){
  const b = e.target.closest('button'); if(!b || !COOK) return;
  const {c, steps} = COOK, key = c.id + ':' + COOK.idx, s = steps[COOK.idx], st = S(c);
  if(ingClick(b, c)) return drawCook();
  if(b.dataset.go!=null) return go(+b.dataset.go);
  const T = DB.timers[key];
  switch(b.dataset.act){
    case 'x': st.cookAt = COOK.idx; save(); location.hash = '#/' + c.id; break;
    case 'ings': openIngSheet(); break;
    case 'prev': go(COOK.idx - 1); break;
    case 'next': COOK.idx===steps.length-1 ? openFinish() : go(COOK.idx + 1); break;
    case 'tstart':
      unlockAudio();
      DB.timers[key] = {end:Date.now() + s.timer*1000, start:Date.now(), total:s.timer, label:s.t, cake:c.id, idx:COOK.idx, bake:!!s.bake};
      save(); drawCook(); tick(); clockAlarm(s.timer); break;
    case 'tpause': T.paused = true; T.left = remain(T); save(); drawCook(); if(DB.prefs.alarm && T.total >= ALARM_MIN) toast('O timer do Relógio continua: pause lá também'); break;
    case 'tresume': T.paused = false; T.end = Date.now() + T.left*1000; T.rung = false; save(); drawCook(); tick(); break;
    case 'tadd': { const add = (s.bake ? 5 : 1)*60; T.end = Math.max(Date.now(), T.end) + add*1000; T.total += add; T.rung = false; T.paused = false; save(); drawCook(); tick(); clockAlarm(remain(T)); break }
    case 'treset': delete DB.timers[key]; save(); drawCook(); break;
    case 'tready': st.lastBake = Math.max(1, Math.round((Date.now() - T.start)/60000)); delete DB.timers[key]; save(); drawCook(); toast(`Tempo registrado: ${st.lastBake} min`); break;
  }
}
function go(i){
  if(!COOK) return;
  COOK.idx = Math.min(Math.max(0, i), COOK.steps.length - 1);
  history.replaceState(null, '', `#/${COOK.c.id}/preparo/${COOK.idx}`);
  const st = S(COOK.c); st.cookAt = COOK.idx; st.cookTs = Date.now(); save(); drawCook();
  const body = $('#cook .cook-body'); if(body) body.scrollTop = 0;
}
function openIngSheet(){
  const {c, cc, top} = COOK;
  openSheet(`<div class="sh-head"><h2>Ingredientes</h2><button class="sh-done" data-close>Pronto</button></div><div class="sh-body"></div>`, el=>{
    const draw = () => { el.querySelector('.sh-body').innerHTML = `<p class="cap">Forma ${lowerFirst(cc.pan.n)}.</p>` + ingList(c, cc, top, S(c)) };
    draw();
    el.addEventListener('click', e=>{ const b = e.target.closest('button'); if(b && ingClick(b, c)) draw() });
  }, {label:'Ingredientes', onClose:()=>{ if(COOK) drawCook() }});
}
function openFinish(){
  const {c, cc, top} = COOK, st = S(c);
  let rating = 0;
  openSheet(`<div class="sh-head"><h2>Bolo pronto</h2><button class="sh-done" data-close>Fechar</button></div>
    <div class="sh-body fin">
      <p class="sh-q">Como ficou?</p>
      <div class="stars" role="radiogroup" aria-label="Nota">${[1,2,3,4,5].map(n=>`<button class="star" role="radio" aria-checked="false" data-star="${n}" aria-label="${n} de 5">${ICON.star}</button>`).join('')}</div>
      <label><span>Tempo real de forno</span><span class="amt"><input id="fin-t" inputmode="numeric" value="${st.lastBake || ''}" placeholder="${cc.time[0]}–${cc.time[1]}"><span>min</span></span></label>
      <label><span>Observação <em>opcional</em></span><textarea id="fin-n" placeholder="Ex.: ficou alto e úmido. Da próxima vez, menos açúcar na cobertura."></textarea></label>
      <div class="actions">
        <button class="btn primary block" data-fin="save">Salvar no histórico</button>
        <button class="btn ghost block" data-fin="skip">Concluir sem salvar</button>
      </div>
    </div>`, el=>{
    el.addEventListener('click', e=>{
      const s = e.target.closest('[data-star]');
      if(s){ rating = +s.dataset.star; el.querySelectorAll('[data-star]').forEach(x=>x.setAttribute('aria-checked', +x.dataset.star <= rating)); return }
      const f = e.target.closest('[data-fin]'); if(!f) return;
      if(f.dataset.fin==='skip') return finishCook(c, null);
      const actual = Math.round(num(el.querySelector('#fin-t').value));
      finishCook(c, {id:'h' + Date.now().toString(36), at:Date.now(), cake:c.id, name:c.name, pan:cc.pan.id, top:top.id, f:+cc.f.toFixed(3),
        rating, note:el.querySelector('#fin-n').value.trim(), exp:[cc.time[0], cc.time[1]], actual: actual > 0 ? actual : null});
    });
  }, {label:'Bolo pronto'});
}
function finishCook(c, entry){
  const st = S(c);
  st.cookAt = null; st.lastBake = null; st.checks = {};
  Object.keys(DB.timers).filter(k=>k.startsWith(c.id+':')).forEach(k=>delete DB.timers[k]);
  if(entry) DB.history.push(entry);
  save(); closeSheet(true);
  location.hash = '#/' + c.id;
  if(entry){
    toast('Salvo no histórico');
    const sg = ovenSuggestion();
    if(sg) setTimeout(()=>suggestSheet(sg), 500);
  } else toast('Bom bolo!');
}
function suggestSheet(sg){
  openSheet(`<div class="sh-head"><h2>Ajustar o forno?</h2></div>
    <div class="sh-body"><p>Nas duas últimas fornadas, o bolo assou ${Math.abs(sg)} min ${sg>0 ? 'além' : 'antes'} do previsto. Quer ${sg>0 ? 'somar' : 'tirar'} ${Math.abs(sg)} min em todos os tempos de forno?</p>
      <p class="cap">Dá para mudar depois em Ajustes.</p>
      <button class="btn primary block" data-sg="ok">Ajustar ${sg>0 ? '+' : '−'}${Math.abs(sg)} min</button>
      <button class="btn ghost block" data-sg="no">Agora não</button></div>`, el=>{
    el.addEventListener('click', e=>{
      const b = e.target.closest('[data-sg]'); if(!b) return;
      if(b.dataset.sg==='ok'){ applyOvenTime(DB.prefs.oven.time + sg); toast('Tempo de forno ajustado') }
      else { DB.prefs.oven.changedAt = Date.now(); save() }
      closeSheet(true);
      const c = CAKE(location.hash.replace(/^#\/?/,'').split('/')[0]); if(c) rerenderCake(c);
    });
  }, {label:'Ajustar o forno'});
}
const remain = T => T.paused ? T.left : (T.end - Date.now())/1000;

/* Deslizar para trocar de passo */
(function(){
  const el = $('#cook'); let sx = 0, sy = 0, ok = false;
  el.addEventListener('click', cookClick);
  el.addEventListener('touchstart', e=>{ ok = !e.target.closest('input,textarea,.timer,.mini'); sx = e.touches[0].clientX; sy = e.touches[0].clientY }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(!ok || !COOK) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dy) < 50){ if(dx < 0){ if(COOK.idx < COOK.steps.length-1) go(COOK.idx + 1) } else if(COOK.idx > 0) go(COOK.idx - 1) }
  }, {passive:true});
})();

/* Timers baseados em horário: seguem certos mesmo com o app em segundo plano */
let ticking = null;
function tick(){
  if(ticking) return;
  ticking = setInterval(()=>{
    const live = Object.entries(DB.timers).filter(([,T])=>!T.paused);
    if(!live.length && !ringing){ clearInterval(ticking); ticking = null; return }
    for(const [k,T] of live){
      const r = remain(T);
      document.querySelectorAll(`[data-clock="${k}"]`).forEach(el=>el.textContent = mm(r));
      if(r <= 0 && !T.rung){
        T.rung = true;
        const c = CAKE(T.cake); if(T.bake && c) S(c).lastBake = Math.round(T.total/60);
        save(); ring(k, T); if(COOK) drawCook();
      }
    }
  }, 250);
}
let ac = null, ringing = null;
function unlockAudio(){
  try{
    if(navigator.audioSession) navigator.audioSession.type = 'playback';
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0; o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .01);
  }catch(e){}
}
function beep(){
  if(!ac) return; const t = ac.currentTime;
  [0,.22,.44].forEach(d=>{ const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0, t+d); g.gain.linearRampToValueAtTime(.35, t+d+.02); g.gain.exponentialRampToValueAtTime(.001, t+d+.18);
    o.connect(g).connect(ac.destination); o.start(t+d); o.stop(t+d+.2) });
}
function ring(k, T){
  const c = CAKE(T.cake), el = $('#ring');
  el.innerHTML = `${c ? swatch(c,'lg') : ''}<h2>${esc(T.label)}</h2><p>Tempo esgotado. ${T.bake ? 'Faça o teste do palito no centro.' : 'Siga para o próximo passo.'}</p>
    <button data-r="ok">Ok</button>${T.bake ? '<button data-r="add">Mais 5 minutos</button>' : ''}`;
  el.hidden = false; beep(); clearInterval(ringing); let n = 0;
  ringing = setInterval(()=>{ beep(); if(++n > 40) stopRing() }, 1500);
  if(navigator.vibrate) navigator.vibrate([300,150,300]);
  el.onclick = e=>{ const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.r==='add'){ T.end = Date.now() + 300e3; T.total += 300; T.rung = false; save(); tick(); clockAlarm(300) }
    stopRing(); if(COOK) drawCook() };
}
function stopRing(){ clearInterval(ringing); ringing = null; $('#ring').hidden = true }

async function requestWake(){
  try{ if('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock = null }) } }catch(e){ wakeLock = null }
}
function releaseWake(){ if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null } }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    if(COOK && DB.prefs.wake && !wakeLock) requestWake();
    if(Object.keys(DB.timers).length) tick();
  }
});

/* início */
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
if(Object.keys(DB.timers).length) tick();
route();
</script>
</body>
