      <p class="cap">O que você usou sai da despensa. Itens sem quantidade continuam marcados.</p>
      <div class="actions">
        <button class="btn primary block" data-fin="save">Salvar e concluir</button>
        <button class="btn ghost block" data-fin="skip">Concluir sem registrar</button>
      </div>
    </div>`, el=>{
    el.addEventListener('click', e=>{
      const s = e.target.closest('[data-star]');
      if(s){ rating = +s.dataset.star; el.querySelectorAll('[data-star]').forEach(x=>x.setAttribute('aria-checked', +x.dataset.star <= rating)); return }
      const f = e.target.closest('[data-fin]'); if(!f) return;
      if(f.dataset.fin==='skip') return finishCook(null);
      const ti = el.querySelector('#fin-t'), actual = ti ? Math.round(num(ti.value)) : 0;
      finishCook({id:'h' + uid(), at:Date.now(), cake:c.id, name:c.name, pan: cc.pan ? cc.pan.id : null, serves: cc.serves || null, top: top ? top.id : null, f:+cc.f.toFixed(3),
        rating, note:el.querySelector('#fin-n').value.trim(), exp: cc.time ? [cc.time[0], cc.time[1]] : null, actual: actual > 0 ? actual : null});
    });
  }, {label:'Pronto'});
}
function finishCook(entry){
  const {c, cc, top} = COOK, st = S(c);
  const {snap, gone} = deduct(c, cc, top);
  if(st.planId) DB.plan = DB.plan.filter(p=>p.id!==st.planId);
  st.cookAt = null; st.lastBake = null; st.checks = {}; st.planId = null;
  Object.keys(DB.timers).filter(k=>k.startsWith(c.id + ':')).forEach(k=>delete DB.timers[k]);
  if(entry) DB.history.push(entry);
  save(); closeSheet(true);
  location.hash = '#/r/' + c.id;
  const msg = gone.length ? `Despensa atualizada. Acabou: ${join(gone.map(p=>lowerFirst(pname(p))))}.` : 'Despensa atualizada.';
  setTimeout(()=>{
    toast(msg, {label:'Desfazer', fn:()=>{ DB.pantry = snap; save(); refresh(); toast('Despensa restaurada') }});
    const sg = entry && ovenSuggestion(); if(sg) setTimeout(()=>suggestSheet(sg), 600);
  }, 50);
}
function suggestSheet(sg){
  openSheet(`<div class="sh-head"><h2>Ajustar o forno?</h2></div>
    <div class="sh-body"><p>Nas duas últimas vezes, o forno levou ${Math.abs(sg)} min ${sg > 0 ? 'a mais' : 'a menos'} que o previsto. Quer ${sg > 0 ? 'somar' : 'tirar'} ${Math.abs(sg)} min em todos os tempos de forno?</p>
      <p class="cap">Dá para mudar depois em Ajustes.</p>
      <button class="btn primary block" data-sg="ok">Ajustar ${sg > 0 ? '+' : '−'}${Math.abs(sg)} min</button>
      <button class="btn ghost block" data-sg="no">Agora não</button></div>`, el=>{
    el.addEventListener('click', e=>{
      const b = e.target.closest('[data-sg]'); if(!b) return;
      if(b.dataset.sg==='ok'){ applyOvenTime(DB.prefs.oven.time + sg); toast('Tempo de forno ajustado') }
      else { DB.prefs.oven.changedAt = Date.now(); save() }
      closeSheet(true); refresh();
    });
  }, {label:'Ajustar o forno'});
}
const remain = T => T.paused ? T.left : (T.end - Date.now())/1000;

(function(){
  const el = $('#cook'); let sx = 0, sy = 0, ok = false;
  el.addEventListener('click', cookClick);
  el.addEventListener('touchstart', e=>{ ok = !e.target.closest('input,textarea,.timer,.mini'); sx = e.touches[0].clientX; sy = e.touches[0].clientY }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(!ok || !COOK) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dy) < 50){ if(dx < 0){ if(COOK.idx < COOK.steps.length - 1) go(COOK.idx + 1) } else if(COOK.idx > 0) go(COOK.idx - 1) }
  }, {passive:true});
})();

let ticking = null;
function tick(){
  if(ticking) return;
  ticking = setInterval(()=>{
    const live = Object.entries(DB.timers).filter(([,T])=>!T.paused);
    if(!live.length && !ringing){ clearInterval(ticking); ticking = null; return }
    for(const [k,T] of live){
      const r = remain(T);
      document.querySelectorAll(`[data-clock="${k}"]`).forEach(el=>el.textContent = mm(r));
      if(r <= 0 && !T.rung){
        T.rung = true;
        const c = REC(T.cake); if(T.bake && c) S(c).lastBake = Math.round(T.total/60);
        save(); ring(k, T); if(COOK) drawCook();
      }
    }
  }, 250);
}
let ac = null, ringing = null;
function unlockAudio(){
  try{
    if(navigator.audioSession) navigator.audioSession.type = 'playback';
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0; o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .01);
  }catch(e){}
}
function beep(){
  if(!ac) return; const t = ac.currentTime;
  [0,.22,.44].forEach(d=>{ const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0, t+d); g.gain.linearRampToValueAtTime(.35, t+d+.02); g.gain.exponentialRampToValueAtTime(.001, t+d+.18);
    o.connect(g).connect(ac.destination); o.start(t+d); o.stop(t+d+.2) });
}
function ring(k, T){
  const c = REC(T.cake), el = $('#ring');
  el.innerHTML = `${c ? swatch(c,'lg') : ''}<h2>${esc(T.label)}</h2><p>Tempo esgotado. ${T.bake ? 'Confira o ponto.' : 'Siga para o próximo passo.'}</p>
    <button data-r="ok">Ok</button>${T.bake ? '<button data-r="add">Mais 5 minutos</button>' : ''}`;
  el.hidden = false; beep(); clearInterval(ringing); let n = 0;
  ringing = setInterval(()=>{ beep(); if(++n > 40) stopRing() }, 1500);
  if(navigator.vibrate) navigator.vibrate([300,150,300]);
  el.onclick = e=>{ const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.r==='add'){ T.end = Date.now() + 300e3; T.total += 300; T.rung = false; save(); tick(); clockAlarm(300) }
    stopRing(); if(COOK) drawCook() };
}
function stopRing(){ clearInterval(ringing); ringing = null; $('#ring').hidden = true }
async function requestWake(){
  try{ if('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock = null }) } }catch(e){ wakeLock = null }
}
function releaseWake(){ if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null } }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    if(COOK && DB.prefs.wake && !wakeLock) requestWake();
    if(Object.keys(DB.timers).length) tick();
  }
});

/* sem zoom: pinça e toque duplo */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));

/* início */
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
if(Object.keys(DB.timers).length) tick();
route();
</script>
<script>
/* Barra de abas flutuante, como no iOS 26: encolhe para uma bolinha com a aba atual ao rolar para baixo e volta
   inteira ao rolar para cima, ao chegar no topo, ao trocar de aba ou ao tocar nela. */
(function () {
  var bar = document.querySelector('#tabbar');
  if (!bar) return;
  var last = 0, min = false, trava = 0;
  function poe(v) { if (v === min) return; min = v; bar.classList.toggle('min', v); }
  function topo(e) {
    var t = e && e.target;
    if (t && t.nodeType === 1 && t !== document.documentElement && t !== document.body) return t.scrollTop;
    return window.scrollY || document.documentElement.scrollTop || 0;
  }
  document.addEventListener('scroll', function (e) {
    var t = e && e.target;
    if (t && t.nodeType === 1 && t.closest && t.closest('[role="dialog"], .sheet, .sheet-bg, .cook, .modal')) return;   // folhas por cima não mexem na barra
    var y = topo(e);
    if (Date.now() < trava || bar.hidden) { last = y; return; }
    if (y < 30) poe(false);
    else if (y - last > 6) poe(true);
    else if (last - y > 6) poe(false);
    last = y;
  }, { capture: true, passive: true });
  // tocar na bolinha só abre a barra (não troca de aba)
  bar.addEventListener('click', function (e) {
    if (!min) return;
    e.preventDefault(); e.stopPropagation(); poe(false); trava = Date.now() + 450;
  }, true);
  window.addEventListener('hashchange', function () { poe(false); last = 0; trava = Date.now() + 450; });
})();
</script>
