<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Receitas">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Receitas</title>
<style>
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --ink:#171716; --ink2:#3B3A37; --muted:#6B6963;
  --line:#E8E7E3; --line2:#D6D4CE; --press:#F1F0EC; --hl:#FFF3D6;
  --tone:#E07B2E; --ok:#2F7D4F; --warn:#8A6100; --acc:#B8321E; --on-acc:#FFFFFF; --acc-soft:#F8E9E5; --sel-p:#7A4A1E; --sel-p-bg:#F4E9DC; --sel-l:#2F6B33; --sel-l-bg:#E4EFE0; --danger:#B42318; --star:#D99A06;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121211;--surface:#1C1C1A;--ink:#F2F1EE;--ink2:#CFCDC7;--muted:#9A978F;--line:#2B2A27;--line2:#403E3A;--press:#262523;--hl:#2E2617;--ok:#5DB27F;--warn:#E0B04A;--acc:#F2856B;--on-acc:#1A0D0A;--acc-soft:#3A201A;--sel-p:#E8B98A;--sel-p-bg:#33261A;--sel-l:#93C98A;--sel-l-bg:#1F2E1C;--danger:#F28B82;--star:#F2B634}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(40px + var(--safe-b))}
.cap{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.cap.center{text-align:center}
em{font-style:normal;color:var(--muted);font-weight:400}

/* ---------- Componentes ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:25px;border:1px solid transparent;background:none;font-size:16px;font-weight:600;text-decoration:none}
.btn svg{width:16px;height:16px;flex:none}
.btn.block{width:100%}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.secondary{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.ghost{color:var(--ink2)}
.btn.danger{background:var(--surface);border-color:var(--line2);color:var(--danger)}
.btn:active{opacity:.85}
.icon-btn{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:22px;background:none;color:var(--ink);text-decoration:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:40px;height:40px}
.icon-btn.sm svg{width:16px;height:16px}
.icon-btn:active{background:var(--press)}
.badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--on-acc);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.link{background:none;border:0;padding:0;color:var(--acc);font-size:15px;font-weight:550;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;margin-left:-6px;padding:0 6px;border:0;background:none;color:var(--acc);font-size:17px;text-decoration:none}
.back svg{width:10px;height:17px}
.tbtn{height:34px;padding:0 13px;border:0;border-radius:17px;background:var(--acc-soft);color:var(--acc);font-size:14px;font-weight:550}
.seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--press)}
.seg button{flex:1;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:15px;font-weight:550}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
.switch{position:relative;flex:none;width:51px;height:31px;border:0;border-radius:16px;background:var(--line2);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked=true]{background:var(--acc)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.chip{flex:none;height:38px;padding:0 15px;border:1px solid var(--line2);border-radius:19px;background:var(--surface);font-size:15px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.chip.sm{height:32px;padding:0 12px;font-size:14px}
.card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{flex:none;white-space:nowrap;font-size:16px;color:var(--ink2)}
.field select{flex:1;min-width:0;padding:14px 22px 14px 0;border:0;background:transparent;text-align:right;text-align-last:right;font-size:16px;font-weight:550;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 7px) 50%,calc(100% - 2px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.amt{display:flex;align-items:center;gap:6px}
.amt input{width:96px;height:40px;padding:0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);text-align:right;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.amt span{min-width:24px;color:var(--muted);font-size:16px}
.swatch{position:relative;flex:none;width:52px;height:52px;overflow:hidden;border-radius:14px}
.swatch svg{display:block;width:100%;height:100%}
.swatch.lg{width:72px;height:72px;border-radius:19px}
.swatch.cat{width:46px;height:46px;border-radius:13px}
.ring .swatch.lg{width:96px;height:96px;border-radius:26px}
.chev{flex:none;width:8px;height:14px;color:var(--line2)}
.mt{margin-top:12px}

/* ---------- Início ---------- */
.home-head{padding:calc(18px + var(--safe-t)) 0 18px}
.hh-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.home-head h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
.hh-btns{display:flex;gap:2px;margin-right:-10px}
.home-head p{margin:6px 0 0;color:var(--muted)}
.cake-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cake-row{display:flex;align-items:center;gap:14px;min-height:72px;padding:14px 2px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.cake-row:active{background:var(--press)}
.cake-row .txt{flex:1;min-width:0;display:block}
.cake-row b{display:block;color:var(--ink);font-size:17px;font-weight:600;letter-spacing:-.01em}
.cake-row .txt>span{display:block;overflow:hidden;color:var(--muted);font-size:14px;white-space:nowrap;text-overflow:ellipsis}
.cake-row .txt>span.miss{color:var(--warn);white-space:normal}
.cake-row .txt>span.swap{color:var(--ink2);white-space:normal}
.cake-row .txt>span.pan-note{color:var(--ink2);white-space:normal}
.pantry{margin:0 0 8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.pantry-toggle,.qty-toggle{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;font-weight:600}
.pantry-toggle{height:54px;padding:0 16px;font-size:17px}
.pantry-toggle>span:first-child,.qty-toggle>span:first-child{flex:1}
.pantry-count{color:var(--muted);font-size:15px;font-weight:500}
.pchev{width:13px;height:8px;color:var(--muted);transition:transform .2s}
.pantry.open .pantry-toggle .pchev,.qty-toggle[aria-expanded=true] .pchev{transform:rotate(180deg)}
.pantry-body{padding:2px 16px 16px;border-top:1px solid var(--line)}
.pg h3{margin:16px 0 8px;color:var(--muted);font-size:14px;font-weight:600}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchips .chip{height:36px;padding:0 14px}
.pantry-actions{display:flex;gap:8px;margin-top:18px}
.qty{margin-top:18px;border-top:1px solid var(--line)}
.qty-toggle{height:50px;padding:0;font-size:16px}
.qty-toggle em{margin-left:4px;font-size:14px}
.qty-help{margin:0 0 6px;color:var(--muted);font-size:14px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-top:1px solid var(--line)}
.qrow .qn{font-size:16px;line-height:1.3}
.qrow .qn small{display:block;color:var(--muted);font-size:13px}
.qrow .amt span{min-width:26px}
.res-h{display:flex;align-items:baseline;gap:8px;margin:28px 0 10px;font-size:20px;font-weight:650;letter-spacing:-.015em}
.res-h span{color:var(--muted);font-size:15px;font-weight:500}
.res-empty{margin:0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:15px}
.mine-h{margin:32px 0 10px;font-size:20px;font-weight:650;letter-spacing:-.015em}
.mine-empty{margin:0;padding:14px 0;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
.new-btn{margin-top:16px}
.home-foot{margin-top:28px;color:var(--muted);font-size:13px;line-height:1.5}

/* ---------- Subpáginas ---------- */
.sub-head{padding:calc(6px + var(--safe-t)) 0 4px}
.sub-head h1{margin:6px 0 0;font-size:30px;line-height:1.12;letter-spacing:-.02em;font-weight:700}

/* ---------- Bolo ---------- */
.ch{padding:calc(6px + var(--safe-t)) 0 0}
.ch-nav{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.ch-title{display:flex;align-items:flex-start;gap:14px;margin-top:8px}
.ch-title h1{margin:0 0 4px;font-size:28px;line-height:1.12;letter-spacing:-.02em;font-weight:700}
.ch-title p{margin:0;color:var(--muted);font-size:15px}
.facts{display:flex;margin-top:18px}
.facts div{flex:1;min-width:0;padding:0 12px;border-left:1px solid var(--line)}
.facts div:first-child{padding-left:0;border-left:0}
.facts small{display:block;color:var(--muted);font-size:13px}
.facts strong{display:block;font-size:18px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.cfg{margin-top:18px}
.cfg-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:9px 14px 9px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.cfg-row:first-child{border-top:0}
.cfg-row:active{background:var(--press)}
.cfg-row .k{flex:none;width:84px;color:var(--muted);font-size:15px}
.cfg-row .v{flex:1;min-width:0;font-size:16px;font-weight:600}
.cfg-row .v small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.cfg-row .chev{color:var(--muted)}
.fitline{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line);color:var(--ink2);font-size:14px}
.fit{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--ink2)}
.dot{flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--ok)}
.warn .dot{background:var(--warn)}
.fit .link{font-size:14px}
.tabs{position:sticky;top:0;z-index:5;margin:22px -20px 0;padding:8px 20px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.list-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 4px}
.list-tools .progress{color:var(--muted);font-size:14px}
.tool-btns{display:flex;gap:6px}
.grp{margin:22px 0 2px;color:var(--ink);font-size:15px;font-weight:650}
.grp small{margin-left:6px;color:var(--muted);font-weight:400}
.ing-row{border-bottom:1px solid var(--line)}
.ing{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 0;border:0;background:none;text-align:left}
.ing:active{background:var(--press)}
.box{flex:none;width:24px;height:24px;margin-top:1px;display:grid;place-items:center;border:1.5px solid var(--line2);border-radius:50%;transition:background .15s,border-color .15s}
.box svg{width:12px;height:12px;opacity:0}
.ing[aria-checked=true] .box{background:var(--ok);border-color:var(--ok)}
.ing[aria-checked=true] .box svg{opacity:1}
.ing[aria-checked=true] .iname,.ing[aria-checked=true] .iq b{color:var(--muted)}
.ing[aria-checked=true] .iname{text-decoration:line-through;text-decoration-color:var(--line2)}
.iname{flex:1;padding-top:1px;font-size:16px;line-height:1.35}
.iname em{font-size:14px}
.iq{flex:none;max-width:52%;text-align:right}
.iq b{display:block;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.iq small{display:block;color:var(--muted);font-size:13px;line-height:1.3;white-space:nowrap}
.sub-btn{display:block;margin:-6px 0 0 36px;padding:2px 0 12px;border:0;background:none;color:var(--acc);font-size:14px;font-weight:550}
.sub-txt{margin:-4px 0 12px 36px;padding:10px 12px;border-radius:var(--r-sm);background:var(--hl);color:var(--ink);font-size:15px}
.shop-btn{margin-top:22px}
.shop-in{display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:15px}
.shop-in>span{display:flex;flex:1;align-items:center;gap:8px;font-weight:600}
.shop-in>span svg{width:16px;height:16px;color:var(--ok)}
.shop-in a,.shop-in button{font-size:15px}
.note-call{margin-top:18px;padding:12px 14px;border-radius:var(--r-md);background:var(--hl)}
.note-call b{display:block;font-size:13px;font-weight:650}
.note-call p{margin:2px 0 0;color:var(--ink);font-size:16px;white-space:pre-line}
.steps{margin:18px 0 0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.steps .n{padding-top:1px;color:var(--muted);font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.steps .ph{grid-column:2;color:var(--muted);font-size:13px}
.steps h3{grid-column:2;margin:0;font-size:17px;font-weight:600}
.steps p{grid-column:2;margin:2px 0 0;color:var(--ink2);font-size:16px}
.steps .t{grid-column:2;margin-top:4px;color:var(--muted);font-size:14px}
b.q{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.tips{margin-top:24px}
.tips h3{margin:0 0 6px;font-size:17px;font-weight:650}
.tips ul{margin:0;padding-left:18px;color:var(--ink2);font-size:15px}
.tips li{margin:6px 0}
.notes{margin-top:18px}
.notes .lbl{display:block;font-size:17px;font-weight:650}
.notes textarea{display:block;width:100%;min-height:120px;margin-top:10px;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--surface);font-size:16px;line-height:1.5;resize:vertical}
.h3{margin:30px 0 4px;font-size:17px;font-weight:650}
.hist{padding:14px 0;border-bottom:1px solid var(--line)}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h-top b{font-size:16px;font-weight:600}
.mini-stars{color:var(--star);font-size:15px;letter-spacing:1px;white-space:nowrap}
.mini-stars i{font-style:normal;color:var(--line2)}
.hist p{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.hist .cap{margin-top:2px}
.hist .link{margin-top:6px;font-size:14px}
.empty{margin:6px 0 0;color:var(--muted);font-size:15px}
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 20px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta{display:block;width:100%;max-width:520px;height:54px;margin:0 auto;border:0;border-radius:27px;background:var(--acc);color:var(--on-acc);font-size:17px;font-weight:650}
.spacer{height:96px}

/* ---------- Folhas (bottom sheet) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:30}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;max-height:90vh;margin:0 auto;padding:0 20px calc(20px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:20px 20px 0 0;background:var(--bg);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.in .sheet-bg{opacity:1}
.sheet-wrap.in .sheet{transform:none}
.grab{width:36px;height:5px;margin:8px auto 0;border-radius:3px;background:var(--line2)}
.sh-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:6px 0;background:var(--bg)}
.sh-head h2{margin:0;font-size:20px;font-weight:700}
.sh-done{height:44px;padding:0 2px;border:0;background:none;color:var(--acc);font-size:17px;font-weight:600}
.sh-sub{margin:18px 0 6px;color:var(--muted);font-size:14px;font-weight:600}
.sh-q{margin:8px 0 4px;font-size:17px;font-weight:600}
.sh-body .seg{margin-top:6px}
.sh-body .btn{margin-top:10px}
.opts{overflow:hidden;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:16px}
.opt:first-child{border-top:0}
.opt:active{background:var(--press)}
.opt>span:first-child{flex:1}
.opt .ot b{display:block;font-weight:600}
.opt .ot small{display:block;margin-top:1px;color:var(--muted);font-size:14px}
.radio{flex:none;width:22px;height:22px;border:1.5px solid var(--line2);border-radius:50%}
.opt[aria-pressed=true] .radio{border:7px solid var(--acc)}
.tag{flex:none;padding:3px 8px;border-radius:10px;background:var(--hl);font-size:12px;font-weight:600}
.stars{display:flex;gap:4px;margin-left:-6px}
.star{width:46px;height:46px;display:grid;place-items:center;border:0;background:none;color:var(--line2)}
.star svg{width:30px;height:30px}
.star[aria-checked=true]{color:var(--star)}
.fin label{display:block;margin-top:18px}
.fin label>span:first-child{display:block;margin-bottom:6px;font-size:15px;font-weight:600}
.fin textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);font-size:16px;line-height:1.45}
.fin .amt{justify-content:flex-start}
.fin .actions{margin-top:20px}
.suggest{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--hl);font-size:15px}
.suggest p{margin:0 0 10px}
.suggest .row{display:flex;gap:8px}

/* ---------- Ajustes ---------- */
.set-sec{margin-top:28px}
.set-sec h2{margin:0 0 10px;font-size:20px;font-weight:650}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:58px;padding:12px 16px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row .t{flex:1;min-width:0}
.set-row .t b{display:block;font-size:16px;font-weight:550}
.set-row .t small{display:block;margin-top:2px;color:var(--muted);font-size:14px;line-height:1.4}

/* ---------- Lista de compras ---------- */

/* ---------- Editor ---------- */

/* ---------- Modo preparo ---------- */
.cook{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}

.bar{height:3px;margin:0 20px;background:var(--line)}

.cook-body{flex:1;width:100%;max-width:600px;margin:0 auto;padding:24px 24px 20px;overflow-y:auto}
.cook-ph{color:var(--muted);font-size:15px;font-weight:550}
.cook-body h2{margin:6px 0 14px;font-size:30px;line-height:1.12;letter-spacing:-.025em;font-weight:700}

.mise{margin-top:8px}
.timer{margin-top:26px;padding:18px 18px 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}

.trow{display:flex;flex-wrap:wrap;gap:8px}
.tb{height:46px;padding:0 18px;border:1px solid var(--line2);border-radius:23px;background:none;font-size:16px;font-weight:600}

.mini{display:flex;flex-wrap:wrap;gap:8px;margin:10px 20px 0}
.mini button{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--hl);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cook-nav{display:flex;gap:10px;width:100%;max-width:600px;margin:0 auto;padding:12px 20px calc(12px + var(--safe-b))}
.cook-nav button{height:56px;border:1px solid var(--line2);border-radius:28px;background:none;font-size:17px;font-weight:650}
.cook-nav .prev{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.cook-nav .prev svg{width:9px;height:15px}
.cook-nav .prev:disabled{opacity:.35}
.cook-nav .next{flex:2;border-color:var(--acc);background:var(--acc);color:var(--on-acc)}

.ring{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--ink);color:var(--bg);text-align:center}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.9}}
.ring{animation:pulse 1.2s ease-in-out infinite}
.toast{position:fixed;left:50%;top:calc(56px + var(--safe-t));z-index:50;max-width:calc(100% - 40px);padding:10px 16px;border-radius:20px;background:var(--ink);color:var(--bg);font-size:15px;transform:translateX(-50%)}

/* ---------- v3: abas, cardápio, despensa ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding:6px 8px calc(4px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}

button.cake-row{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit}

.okt{color:var(--ok)}
.miss{color:var(--warn)}
.search{position:relative;display:block;margin-top:2px}
.search input{width:100%;height:44px;padding:0 14px 0 40px;border:0;border-radius:12px;background:var(--press);font-size:17px;-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--muted)}

.cook-card{display:flex;align-items:center;gap:14px;margin-top:4px;padding:14px 16px;border-radius:var(--r-md);background:var(--ink);color:var(--bg);text-decoration:none}

.plan-card span{flex:1}
.istat{margin:16px 0 0;font-size:15px;font-weight:550}
.box.have{background:var(--ok);border-color:var(--ok)}
.box.have svg{opacity:1}
.box.miss{border:1.5px dashed var(--warn)}
.box.na{border-color:transparent}

.prow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.pbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 0;border:0;background:none;text-align:left;font-size:16px}

.sv{min-width:28px;text-align:center;font-size:17px;font-weight:650;align-self:center}
.toast{display:flex;align-items:center;gap:14px;width:max-content}
.toast button{flex:none;padding:0;border:0;background:none;color:var(--bg);font-size:15px;font-weight:700;text-decoration:underline;text-underline-offset:3px}

html{touch-action:manipulation}

.picks{border-top:1px solid var(--line)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}

.cartbtn{flex:none;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:20px;background:none;color:var(--muted)}

.cal-day{margin-top:26px}

.nutri p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}.nutri b{color:var(--ink);font-weight:650}
.slot{margin-top:6px}
.slot-h{display:flex;align-items:center;gap:8px;min-height:50px;border-bottom:1px solid var(--line)}

.opt[aria-pressed=true] .cbox{border-color:var(--acc);background:var(--acc)}

.fchip.now{gap:5px;padding:0 11px 0 9px;border:1.5px solid var(--acc);color:var(--acc);font-weight:650}

.fdiv{flex:none;width:1px;height:20px;margin:0 3px;background:var(--line2)}
.rmeal{margin-top:10px}
.fchips[hidden]{display:none}

.pk-fav{display:inline-block;width:13px;height:13px;margin-left:6px;color:#D9416A;vertical-align:-1px}

.acts{grid-column:2;margin:4px 0 0;padding-left:20px;color:var(--ink2);font-size:16px}
.acts li{margin:3px 0;padding-left:2px}
.acts li::marker{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.cook-acts{margin:0;padding:0;list-style:none}
.cook-acts li+li{margin-top:2px}
.act{display:flex;align-items:flex-start;gap:12px;width:100%;padding:10px 0;border:0;background:none;color:var(--ink2);text-align:left;font-size:19px;line-height:1.45}
.an{flex:none;display:grid;place-items:center;width:28px;height:28px;margin-top:1px;border:1.5px solid var(--line2);border-radius:14px;color:var(--muted);font-size:14px;font-weight:650;line-height:1}

.td .home-head{padding-bottom:6px}

.td-hf{padding:12px 16px 16px}
.td-st{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--bg);color:var(--ink2);font-size:14px;font-weight:550}

.td-wk .dt i{width:6px;height:6px;border-radius:3px}

.td-q .hd b{flex:1;min-width:0;font-size:15px;font-weight:650}
.td-q .hd>svg{flex:none;color:var(--muted)}

.td-q .v em{display:block;margin-bottom:1px;color:var(--ink);font-size:26px;font-style:normal;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}

.td-q .ic,.td-empty .ic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--acc-soft);color:var(--acc)}
.td-q .ic svg,.td-empty .ic svg{width:20px;height:20px}
.td-strip{display:flex;gap:12px;margin:0 -20px;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}

.td-empty>span:nth-child(2){flex:1}

.td-empty small{display:block;color:var(--muted);font-size:13.5px}

/* abas no estilo do iOS 26: cápsula de vidro flutuando sobre o conteúdo; ao rolar para baixo encolhe para uma bolinha
   com a aba atual (script "barra de abas flutuante" no fim da página) e volta ao rolar para cima ou ao tocar nela */
:root{--tb-h:64px;--tb-b:max(10px,calc(var(--safe-b) - 12px))}
.tabbar{left:max(14px,env(safe-area-inset-left,0px),calc(50% - 260px));right:auto;width:min(520px,calc(100% - 28px));bottom:var(--tb-b);height:var(--tb-h);padding:4px;align-items:stretch;overflow:hidden;border:.5px solid color-mix(in srgb,var(--ink) 10%,transparent);border-radius:32px;background:color-mix(in srgb,var(--surface) 60%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 12px 32px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.35);transition:width .42s cubic-bezier(.25,.9,.3,1.05),height .42s cubic-bezier(.25,.9,.3,1.05),padding .42s}
.tabbar a{max-width:none;justify-content:center;border-radius:28px;padding:0;gap:2px;font-size:10.5px;transition:background .2s,transform .15s}
.tabbar a:active{transform:scale(.93)}
.tabbar a[aria-current=page]{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.tabbar .badge{top:6px}
.tabbar.min{width:56px;height:56px;padding:3px}
.tabbar.min a:not([aria-current=page]){display:none}
.tabbar.min a{font-size:0;gap:0;background:none}
.tabbar.min .badge{display:none}
body.tabs-on .cta-bar{bottom:calc(var(--tb-h) + var(--tb-b) + 2px)}
@media (prefers-color-scheme: dark){.tabbar{background:color-mix(in srgb,var(--surface) 55%,transparent);border-color:rgba(255,255,255,.12);box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}.tabbar a[aria-current=page]{background:rgba(255,255,255,.10)}.tabbar.min a{background:none}}
@media (prefers-reduced-motion: reduce){.tabbar,.tabbar a{transition:none}}
</style>

/* Estimativa por porção da receita base. null para bolos (escala por forma). */
const _nut = new Map();
function nutri(c){
  if(!c) return null;
  if(!c.custom && _nut.has(c.id)) return _nut.get(c.id);
  const forma = c.scale==='forma';
  let p = 0, k = 0, f = 0, known = 0, total = 0;
  const add = (list, top) => { for(const i of list){
    const id = forma ? pid(i, top) : (i.opt ? null : i.p);
    if(!id) continue;
    const N = NUT[id]; total++;
    if(!N){ if(CAT[id] && CAT[id].track===false) known++; continue }
    known++;
    let g = i.u==='g' || i.u==='ml' ? i.q : i.u==='un' ? i.q * (N[2] || 0) : i.q * (CS_G[i.u] || 0);
    if(/fritar/i.test(i.n || '')) g *= .15; // só uma parte do óleo de fritura fica no alimento
    p += g * N[0] / 100; k += g * N[1] / 100; f += g * (FAT[id] || 0) / 100;
  } };
  add(c.ing);
  if(forma){ const t = TOP((c.tops || ['nenhuma'])[0]); if(t && t.ing && t.ing.length) add(t.ing, t.id) }
  let out = null;
  if(total && known >= total * .8){
    const s = forma ? CAKE_SLICES : (c.serves || 1);
    out = {p: Math.round(p / s), c: Math.round(k / s), kcal: Math.round((4*p + 4*k + 9*f) / s / 10) * 10, per: forma ? 'fatia' : 'porção'};
  }
  if(!c.custom) _nut.set(c.id, out);
  return out;
}

/* Tags: as calculadas saem dos dados; "uma panela" e "marmita" são editoriais. */
const TAGDEF = [['prot','Proteica','Proteicas'],['low','Pouco carbo','Pouco carbo'],['rap','Rápida','Rápidas'],['marm','Marmita','Boas para marmita'],['pan','Uma panela','Uma panela só'],['sf','Sem forno','Sem forno'],['veg','Vegetariana','Vegetarianas']];
const ONE_POT = new Set('carne-panela almondegas strogonoff-carne carreteiro frango-ensopado strogonoff-frango frango-xadrez canja sopa-legumes caldo-verde creme-abobora sopa-ervilha peixe-assado frango-assado galeto sobrecoxa-limao frango-curry strogonoff-leve parmegiana-assada puchero carne-moida-abobrinha tainha-assada peixe-ensopado tilapia-parmesao salmao-brocolis camarao-alho sopa-capeletti sopa-lentilha frango-batata-doce picadinho-abobora moqueca curry-grao entrevero vaca-atolada shakshuka-verde peixe-papelote frango-tikka risoto-cogumelos ovos-tomate'.split(' '));
const MARMITA = new Set('tortilla-espanhola ovos-recheados carne-panela almondegas strogonoff-carne carreteiro frango-ensopado fricasse frango-xadrez escondidinho torta-frango panqueca quibe canja sopa-legumes sopa-ervilha caldo-verde creme-abobora lasanha bolonhesa puchero carne-moida-abobrinha escondidinho-couve-flor abobrinha-recheada lasanha-abobrinha frango-curry polenta-ragu sopa-lentilha salada-atum-grao frango-batata-doce picadinho-abobora kafta frango-cuscuz-marroquino curry-grao entrevero massa-frango-brocolis vaca-atolada baiao-de-dois frango-quiabo pimentao-recheado berinjela-recheada tabule-quinoa salada-lentilha frango-tikka muffin-espinafre omelete-forno falafel quiche-alho-poro pacoca-pinhao sobrecoxa-limao'.split(' '));
const NOT_QUICK = new Set(['overnight-oats','pudim-chia','ovos-shoyu','sagu-uva']);
const _tags = new Map();
function tagsOf(c){
  if(!c || c.scale==='forma') return [];
  const key = c.id + ':' + (c.custom ? c.ver || '' : '');
  if(!c.custom && _tags.has(key)) return _tags.get(key);
  const n = nutri(c), on = new Set();
  if(n && n.p >= SEL_PROT) on.add('prot');
  if(n && n.c <= SEL_CARB) on.add('low');
  if(c.time <= 30 && !NOT_QUICK.has(c.id)) on.add('rap');
  if(MARMITA.has(c.id) || (c.from && MARMITA.has(c.from))) on.add('marm');
  if(ONE_POT.has(c.id) || (c.from && ONE_POT.has(c.from))) on.add('pan');
  if(!c.oven) on.add('sf');
  if(!c.ing.some(i=>i.p && CAT[i.p] && (CAT[i.p].sec==='carn' || i.p==='atum'))) on.add('veg');
  const out = TAGDEF.filter(([k])=>on.has(k)).map(([k,l])=>[k,l]);
  if(!c.custom) _tags.set(key, out);
  return out;
}
const hasTag = (c, k) => tagsOf(c).some(t=>t[0]===k);
/* No máximo 3 selos por receita, na ordem de TAGDEF. */
function selos(c){ return tagsOf(c).slice(0,3) }


/* =========================================================
   CATEGORIAS E REFEIÇÕES
   ========================================================= */
const CATS = [
  {id:'ovos', n:'Ovos', tone:'#E3B23C'},
  {id:'peixe', n:'Peixes e frutos do mar', tone:'#5E86C9'},
  {id:'carne', n:'Carne', tone:'#C0412F'},
  {id:'leves', n:'Saladas e leguminosas', tone:'#5F9E45'},
  {id:'sopas', n:'Sopas e caldos', tone:'#3FA3A3'},
  {id:'frango', n:'Frango', tone:'#EE8A2E'},
  {id:'forno', n:'Forno', tone:'#7F8A99'},
  {id:'massas', n:'Massas e risotos', tone:'#8C7BC9'},
  {id:'cafe', n:'Café da manhã', tone:'#9C6B4A'},
  {id:'lanches', n:'Lanches', tone:'#E8664A'},
  {id:'doces', n:'Sobremesas', tone:'#B35FA6'},
  {id:'bolos', n:'Bolos', tone:'#6B3F2A'}
];
const MEALS = [['cafe','Café da manhã'],['almoco','Almoço'],['lanche','Lanche'],['janta','Jantar']];
const MEAL_SHORT = {cafe:'Café', almoco:'Almoço', lanche:'Lanche', janta:'Jantar'};
/* Tipos de receita: refeição (café, almoço, jantar), lanche e sobremesa. */
const KINDS = [['ref','Refeições','Refeição'],['lan','Lanches','Lanche'],['sob','Sobremesas','Sobremesa']];
const KIND_OVR = {'wrap-ovo':['lan'], 'crepe-aveia':['lan'], 'ovos-tomate':['ref','lan']};
function kindsOf(c){
  if(c.kinds && c.kinds.length) return c.kinds;
  if(KIND_OVR[c.id]) return KIND_OVR[c.id];
  if(c.cat==='doces') return ['sob'];
  if(c.cat==='bolos') return ['lan','sob'];
  const m = c.meals || [], out = [];
  // Refeição = prato de almoço ou jantar. Café da manhã e lanche contam como lanche.
  if(c.cat!=='lanches' && m.some(x=>x==='almoco' || x==='janta')) out.push('ref');
  if(c.cat==='lanches' || m.some(x=>x==='cafe' || x==='lanche')) out.push('lan');
  return out.length ? out : ['ref'];
}
const isKind = (c, k) => k==='all' || kindsOf(c).includes(k);

/* Ingrediente compacto: [catálogo, quantidade, unidade?, nota?, id local?]
   Nota começando com "?" = opcional. */
const RECIPES = [];
function R(o){
  const ing = o.ing.map(t=>{
    const [cid, q, u, note, lid] = t, c = CAT[cid];
    if(!c) throw new Error('Ingrediente desconhecido: ' + cid);
    const opt = !!note && note[0]==='?', nt = note ? note.replace(/^\?/,'') : '', uu = u || c.u;
    return {id:lid || cid, p:c.skip ? null : cid, n:c.n + (nt ? ', ' + nt : ''), q, u:uu, opt,
      s: uu==='un' ? (c.s || c.n.toLowerCase()) : 'de ' + c.n.charAt(0).toLowerCase() + c.n.slice(1),
      s1:c.s1, r:c.r, cup:uu===c.u ? c.cup : undefined, sp:uu===c.u ? c.sp : undefined, each:uu===c.u ? c.each : undefined, egg:c.egg};
  });
  RECIPES.push(Object.assign({scale:'porcao', tops:['nenhuma'], tips:[], after:[]}, o, {ing, tone:o.tone || CATS.find(x=>x.id===o.cat).tone}));
}

  const n = parseInt(hex.slice(1),16), r = n>>16, g = n>>8&255, b = n&255;

}

function normalize(){
  DB.cakes = DB.cakes || {};
  DB.prefs = Object.assign({home:true, wake:true, alarm:false}, DB.prefs || {});
  DB.prefs.oven = Object.assign({time:0, temp:0, fan:false, changedAt:0}, DB.prefs.oven || {});
  DB.timers = DB.timers || {}; DB.custom = DB.custom || []; DB.history = DB.history || [];
  DB.plan = DB.plan || []; DB.extras = DB.extras || []; DB.bought = DB.bought || []; DB.favs = DB.favs || [];
  DB.market = Object.assign({to:null, undated:true}, DB.market || {});
  if(!DB.pantry){
    DB.pantry = {};
    const old = DB.prefs.pantry || [], oq = DB.prefs.qty || {};
    old.forEach(p=>{ if(CAT[p]) DB.pantry[p] = {q: oq[p] > 0 ? oq[p] : null} });
    if(!old.length) SEED.forEach(p=>{ DB.pantry[p] = {q:null} });
  }
  delete DB.prefs.pantry; delete DB.prefs.qty; delete DB.prefs.pantryOpen; delete DB.prefs.qtyOpen;
  if(DB.shop){ (DB.shop.items||[]).forEach(id=>{ if(!DB.plan.some(x=>x.rid===id)) DB.plan.push({id:uid(), rid:id, date:null, meal:null}) }); delete DB.shop }
}

const scalable = i => i.u==='g' || i.u==='ml' || i.u==='un';
function calc(c, cfg){
  cfg = cfg || SR(c);
  const O = DB.prefs.oven;
  if(c.scale!=='forma'){
    const serves = Math.max(1, cfg.serves || c.serves), f = serves / c.serves;
    let time = null, dial = null;
    if(c.oven){ time = [Math.max(5, c.oven.bake[0] + O.time), Math.max(8, c.oven.bake[1] + O.time)]; dial = c.oven.temp - (O.fan ? 20 : 0) - O.temp }
    return {f, ft:1, serves, pan:null, time, dial, fill:1};
  }
  let pan = PAN(cfg.pan), f = pan.vol, fill = 1, suggested = null, baseIng = null;
  if(cfg.mode==='ing'){
    baseIng = c.ing.find(i=>i.id===cfg.base && scalable(i)) || c.ing.find(i=>i.id===c.key && scalable(i)) || c.ing.find(scalable);
    const amt = Number(cfg.amt);
    f = amt > 0 && baseIng ? amt / baseIng.q : 1;
    suggested = PANS.reduce((a,p)=> Math.abs(Math.log(p.vol/f)) < Math.abs(Math.log(a.vol/f)) ? p : a);
    if(!cfg.panManual) pan = suggested;
    fill = f / pan.vol;
  }
  const dt = pan.dt - (c.refDt || 0);
  let [a,b] = c.bake; a += dt; b += dt;
  if(fill > 1.12){ a += 5; b += 5 } else if(fill < .88){ a -= 5; b -= 5 }
  a += O.time; b += O.time;
  return {f, ft:pan.area, pan, fill, suggested, baseIng, time:[Math.max(10,a), Math.max(15,b)], dial: c.temp - (O.fan ? 20 : 0) - O.temp};
}
const FR = {0:'',25:'¼',50:'½',75:'¾'};
function frac(x, step=.25){
  const r = Math.round(x/step)*step, w = Math.floor(r + 1e-9), p = Math.round((r-w)*100);
  if(w===0 && p===0) return '0';
  return (w ? String(w) : '') + (FR[p] || '');
}
function nf(x){ return x.toLocaleString('pt-BR') }
function roundQ(q){ return q < 20 ? Math.round(q) : Math.round(q/5)*5 }
function fmt(ing, k){
  const raw = (ing.q || 1) * (ing.u==='pitada' ? 1 : k);
  if(ing.u==='pitada') return {main:'1 pitada'};
  if(ing.u==='cc' || ing.u==='cs'){ const v = Math.max(.25, Math.round(raw*4)/4); return {main: frac(v) + (v > 1 ? ' colheres de ' : ' colher de ') + (ing.u==='cc' ? 'chá' : 'sopa')} }
  if(ing.u==='xic'){ const v = Math.max(.25, Math.round(raw*4)/4); return {main: frac(v) + (v > 1.12 ? ' xícaras' : ' xícara')} }
  if(ing.u==='un'){
    const step = ing.r || 1, n = Math.max(step, Math.round(raw/step)*step), txt = step < 1 ? frac(n, step) : nf(n);
    const out = {main: txt + ' ' + (n <= 1 ? (ing.s1 || ing.s) : ing.s), n, txt};
    if(ing.egg){
      const d = raw - n, conta = nf(Math.round(raw*10)/10);
      if(d >= .25) out.hint = `Use grandes (conta: ${conta})`; else if(d <= -.25) out.hint = `Use médios (conta: ${conta})`;
    }
    return out;
  }
  const q = Math.max(1, roundQ(raw)), unit = ing.u;
  const out = {main: nf(q) + ' ' + unit, q};
  if(unit==='ml' && q >= 1000){ out.main = nf(Math.round(q/100)/10) + (q >= 2000 ? ' litros' : ' litro'); if(ing.p===null || ing.id==='agua') return out }
  if(ing.id==='agua') return out;
  if(DB.prefs.home){
    if(ing.each){ const n = Math.round(q/ing.each.g*2)/2; if(n >= .5) out.hint = '≈ ' + frac(n,.5) + ' ' + (n > 1 ? ing.each.many : ing.each.one) }
    else if(unit==='ml'){ out.hint = q >= 60 ? '≈ ' + frac(q/240) + ' xícara' + (q/240 > 1.12 ? 's' : '') : '≈ ' + frac(q/15,.5) + ' colher' + (q/15 > 1.25 ? 'es' : '') + ' de sopa' }
    else if(ing.cup && q >= ing.cup*.25){ const x = q/ing.cup; out.hint = '≈ ' + frac(x) + ' xícara' + (x > 1.12 ? 's' : '') }
    else if(ing.sp){ const x = Math.max(.5, Math.round(q/ing.sp*2)/2); out.hint = '≈ ' + frac(x,.5) + ' colher' + (x > 1 ? 'es' : '') + ' de sopa' }
  }
  return out;
}

function render_text(txt, c, cc, extra, uses){

  return txt.replace(/\{(\w+)\}/g, (m,id)=>{

    return m;
  });
}

const ACT_VERBS = 'abaixe abra acrescente adicione adoce afunde amasse apague aperte arrume asse aumente bata branqueie coloque corte cozinhe cubra derreta descanse descasque deslize desligue desfie despeje dissolva distribua divida dobre doure enrole envolva escorra esfregue esfrie espalhe esprema faça fatie feche ferva finalize forre frite gire grelhe guarde junte lave leve marine mergulhe mexa misture modele monte passe pincele pique polvilhe ponha processe prove pulse quebre rale raspe recheie refogue regue reserve retire risque sacuda salgue salteie seque sele separe sirva tampe tempere tire toste unte vire volte'.split(' ');
const ACT_RE = new RegExp('(,| e) (?=(' + ACT_VERBS.join('|') + ')\\b)', 'gi');
function splitActs(html){
  const sent = html.split(/(?<=[.!?])\s+(?=[A-ZÀ-ÖØ-Þ<])/).map(x=>x.trim()).filter(Boolean);
  const parts = [];
  for(const se of sent){
    // não quebra dentro de parênteses
    let depth = 0, buf = '', out = [];
    const marked = se.replace(ACT_RE, (m, sep, v, off)=>{ const before = se.slice(0, off); const open = (before.match(/\(/g)||[]).length - (before.match(/\)/g)||[]).length; return open > 0 ? m : '\u0001' });
    marked.split('\u0001').forEach(x=>{ x = x.trim().replace(/,$/, ''); if(x) parts.push(x.charAt(0).toUpperCase() + x.slice(1)) });
  }
  // frase que começa com complemento ("Na mesma panela", "Com as mãos untadas") vai junto da ação seguinte
  const LEAD = /^(na|no|nas|nos|numa|num|com|em|à|ao|às|depois|sem|quando|faltando|enquanto|ainda|assim)(?=[\s,])/i;
  const merged = [];
  for(let i = 0; i < parts.length; i++){
    let p = parts[i];
    while(i + 1 < parts.length && LEAD.test(p.replace(/<[^>]+>/g,'')) && !/[.!?:]$/.test(p) && p.replace(/<[^>]+>/g,'').split(' ').length <= 6){
      const nx = parts[++i]; p = p + ', ' + nx.charAt(0).toLowerCase() + nx.slice(1);
    }
    merged.push(p);
  }
  const out = [];
  for(let p of merged){
    if(!/[.!?:]$/.test(p.replace(/<[^>]+>$/,''))) p += '.';
    if(out.length && p.replace(/<[^>]+>/g,'').length < 5) out[out.length-1] = out[out.length-1].replace(/\.$/, ',') + ' ' + p.charAt(0).toLowerCase() + p.slice(1);
    else out.push(p);
  }
  return out;
}

function buildSteps(c, cc, top){
  const out = [], O = DB.prefs.oven;
  const P = (ph, s, extra, more) => { const uses = []; out.push(Object.assign({ph, t:s.t, d:render_text(s.d, c, cc, extra, uses), uses, timer:s.timer || 0}, more || {})) };
  P('Antes de começar', {t:'Separe tudo', d: c.ing.some(i=>i.egg)
    ? 'Marque cada ingrediente ao separar. Deixe os ovos fora da geladeira: em temperatura ambiente, rendem melhor.'
    : 'Marque cada ingrediente ao separar.'}, null, {mise:true});
  const temp = c.scale==='forma' ? c.temp : (c.oven && c.oven.temp);
  const adj = cc.dial!=null && cc.dial!==temp ? ` A receita pede ${temp} °C; o valor já está ajustado ao seu forno.` : ` Se o forno tiver ventilação, use ${temp-20} °C.`;
  const tAdj = O.time ? ` O tempo já inclui ${O.time > 0 ? '+' : '−'}${Math.abs(O.time)} min do ajuste do seu forno.` : '';

  if(c.scale!=='forma'){
    const pre = c.oven ? (c.oven.pre || 0) : -1;
    const preheat = () => P('Forno', {t:'Preaqueça o forno', d:`Preaqueça o forno a <b class="q">${cc.dial} °C</b>.${adj}`});
    c.steps.forEach((s,n)=>{ if(n===pre) preheat(); P('Preparo', s) });
    if(c.oven){
      if(pre >= c.steps.length) preheat();
      P('Forno', {t:'Asse', d:`Asse por {time}. ${c.done || 'Está pronto quando dourar.'}${tAdj}`, timer:cc.time[0]*60}, null, {bake:true});
    }
    (c.after || []).forEach(s=>P('Finalização', s));
    return out;
  }

  const unmold = ['tube','round','loaf'].includes(cc.pan.shape);
  P('Antes de começar', {t:'Forno e forma', d:`Preaqueça o forno a <b class="q">${cc.dial} °C</b>.${adj} Unte a forma ${lowerFirst(cc.pan.n)} com manteiga e polvilhe farinha, batendo o excesso.`});
  c.steps.forEach(s=>P('Massa', s));
  P('Forno', {t:'Asse', d:`Asse por {time}. Não abra o forno nos primeiros 20 minutos. ${c.done || 'Está pronto quando dourar e um palito espetado no centro sair limpo.'}${tAdj}`, timer:cc.time[0]*60}, null, {bake:true});
  (c.after || []).forEach(s=>P('Finalização', s));
  if(top.when==='quente' || top.when==='morno') top.prep.forEach(s=>P('Cobertura, enquanto o bolo assa', s, top));
  if(top.when==='quente'){
    P('Finalização', {t:'Cubra o bolo', d:(unmold ? 'Espere 5 minutos, desenforme num prato e, ainda quente: ' : '') + top.apply, timer: c.cool ? 0 : (top.applyTimer || 0)}, top);

function topOf(c, cfg){ return c.scale==='forma' ? TOP((cfg || SR(c)).top) : null }

  c.ing.forEach(i=>add(i, cc.f, null));
  if(top) top.ing.forEach(i=>add(i, cc.ft, top.id));
  return m;
}
function status(c, cfg){
  cfg = cfg || SR(c);
  const cc = calc(c, cfg), m = needs(c, cc, topOf(c, cfg)), miss = [], short = [];
  for(const e of m.values()){
    const h = DB.pantry[e.p];
    if(!h){ miss.push(e.p); continue }
    if(h.q > 0 && e.q > 0){ const u = punit(e.p), need = u==='un' ? Math.max(1, Math.round(e.q)) : e.q*.95; if(need > h.q) short.push({p:e.p, need:e.q, have:h.q}) }
  }
  const swaps = miss.filter(x=>{ const s = SUBS[x]; return s && s.need && (s.need==='agua' || DB.pantry[s.need]) });
  const swapOnly = miss.length > 0 && !short.length && swaps.length===miss.length;
  return {miss, short, swaps, swapOnly, ok: !miss.length && !short.length, total:m.size};
}
function missNames(s){ return [...s.miss.map(x=>lowerFirst(pname(x))), ...s.short.map(x=>'mais ' + lowerFirst(pname(x.p)))] }
function statusTxt(s){
  if(s.ok) return 'Tem tudo em casa';

  const n = missNames(s);
  return (n.length > 1 ? 'Faltam: ' : 'Falta: ') + (n.length > 3 ? n.slice(0,3).join(', ') + ` e mais ${n.length-3}` : join(n));
}
function cfgOf(c, pl){
  const st = SR(c);
  if(!pl) return st;
  return {mode:'forma', serves:pl.serves || st.serves || c.serves, pan:pl.pan || st.pan, top:pl.top || st.top, base:st.base, amt:st.amt, panManual:false};

function packTxt(p, q){
  const C = CAT[p], u = punit(p);

  if(u==='un'){ const n = Math.ceil(q - 1e-9); return nf(n) + ' ' + (n===1 ? (C.s1 || C.n.toLowerCase()) : (C.s || C.n.toLowerCase())) }
  const base = q >= 1000 && u!=='un' ? nf(Math.round(q/100)/10) + (u==='g' ? ' kg' : ' litros') : nf(roundQ(Math.max(q,1))) + ' ' + u;
  if(C.each){ const n = Math.ceil(q/C.each.g - .05); return `${n} ${n>1 ? C.each.many : C.each.one} (${base})` }
  return base;
}
function buyAmount(p, q){ const C = CAT[p], u = punit(p); if(!u) return null; if(u==='un') return Math.ceil(q - 1e-9); if(C.each) return Math.ceil(q/C.each.g - .05) * C.each.g; return roundQ(q) }
function shopData(){
  const tot = new Map();
  for(const pl of DB.plan.filter(inMarket)){
    const c = REC(pl.rid); if(!c) continue;
    const cfg = cfgOf(c, pl), cc = calc(c, cfg);
    for(const e of needs(c, cc, topOf(c, cfg)).values()){
      const t = tot.get(e.p) || {p:e.p, q:0, from:[]}; t.q += e.q;
      if(!t.from.includes(c.name)) t.from.push(c.name);
      tot.set(e.p, t);
    }
  }
  const rows = [];
  for(const t of tot.values()){
    const C = CAT[t.p]; if(!C || C.noBuy) continue;
    const u = punit(t.p), h = DB.pantry[t.p];
    let buy = t.q, note = '';
    if(h){
      if(!u || !(h.q > 0) || !(t.q > 0)) continue;
      buy = (u==='un' ? Math.ceil(t.q - 1e-9) : t.q) - h.q;
      if(buy <= (u==='un' ? 0 : t.q*.05)) continue;
      note = `tem ${qtyTxt(t.p, h.q)}`;
    }
    rows.push(Object.assign({}, t, {buy: u && t.q > 0 ? buy : 0, note}));
  }
  for(const x of DB.extras){
    if(!x.p || x.done || !CAT[x.p]) continue;
    const row = rows.find(y=>y.p===x.p);
    if(row) row.manual = x.id;
    else rows.push({p:x.p, q:0, from:[], buy:0, note:'', manual:x.id});
  }
  rows.sort((a,b)=>pOrder(a.p) - pOrder(b.p));
  return {rows};
}
const buyCount = () => shopData().rows.length + DB.extras.filter(x=>!x.p && !x.done).length;

  const m = manualOf(p);
  if(m){ DB.extras = DB.extras.filter(x=>x!==m); save(); return false }
  DB.extras.push({id:uid(), p, n:CAT[p].n, done:false}); save(); return true;
}
function deduct(c, cc, top){
  const snap = JSON.parse(JSON.stringify(DB.pantry)), gone = [];
  for(const e of needs(c, cc, top).values()){
    const h = DB.pantry[e.p];
    if(h && h.q > 0 && e.q > 0){
      h.q = Math.round((h.q - e.q)*100)/100;
      if(h.q <= (punit(e.p)==='un' ? .4 : 1)){ delete DB.pantry[e.p]; gone.push(e.p) }
    }
  }
  return {snap, gone};
}

  const n = Math.round((day(Date.now()) - day(ts)) / 864e5);

  if(n < 30){ const w = Math.floor(n/7); return `há ${w} semana${w>1?'s':''}` }

  const h = DB.history.filter(e=>e.actual > 0 && e.exp && e.at > DB.prefs.oven.changedAt).slice(-2);

  const run = Object.entries(DB.timers).filter(([k,T])=>k.startsWith(c.id + ':')).sort((a,b)=>remain(a[1]) - remain(b[1]))[0];
  el.innerHTML = `<a class="cb-go" href="#/r/${c.id}/preparo/${i}">${swatch(c,'sm')}<span class="cb-t"><b>${esc(c.name)}</b><small>${run ? `${ICON.clock}<span data-clock="${run[0]}">${mm(remain(run[1]))}</span> · ` : ''}Passo ${i+1} de ${steps.length}${list.length > 1 ? ` · +${list.length-1} em preparo` : ''}</small></span><span class="cb-btn">Continuar</span></a>`;
  el.hidden = false; document.body.classList.add('cookbar-on');
  const tb = $('#tabbar'), cta = document.querySelector('.cta-bar');
  const tbh = tb.hidden ? 0 : tb.offsetHeight;
  el.style.bottom = (cta ? tbh + cta.offsetHeight - 6 : tbh + 8) + 'px';
  if(run) tick();
}
function render(){
  const h = parts();
  if(!['nova','editar','versao'].includes(h[0])) ED = null;
  if(!h[0]) return renderToday(), 'hoje';
  if(h[0]==='receitas') return (h[1] ? renderCategory(h[1]) : renderRecipes()), 'receitas';
  if(h[0]==='despensa' && h[1]==='comprar'){ location.replace('#/compras'); return }
  if(h[0]==='despensa') return renderPantry('home'), 'despensa';
  if(h[0]==='compras') return renderPantry('buy'), 'compras';
  if(h[0]==='calendario') return renderCalendar(), 'calendario';
  if(h[0]==='ajustes') return renderSettings(), 'hoje';
  if(h[0]==='nova') return renderEditor(null, 'new'), null;
  if(h[0]==='editar' && DB.custom.some(x=>x.id===h[1])) return renderEditor(h[1], 'edit'), null;
  if(h[0]==='versao' && REC(h[1])) return renderEditor(h[1], 'version'), null;
  if(h[0]==='r' && REC(h[1])) return renderRecipe(REC(h[1])), tabFor(LAST_LIST.replace(/^#\/?/,'').split('/')) || 'receitas';
  return 'redirect';
}
function route(){
  const h = parts();
  closeSheet(true); closeCook();
  if(h[0] && h[0]!=='r' && !['receitas','despensa','compras','calendario','ajustes','nova','editar','versao'].includes(h[0]) && REC(h[0])){ location.replace('#/r/' + h[0]); return }
  const tab = render();
  if(tab==='redirect'){ location.replace('#/'); return }
  setTabbar(tab);
  if(h[0]==='r' && h[2]==='preparo'){ openCook(REC(h[1]), Number(h[3]) || 0); return }
  if(h[0]!=='r' && !['nova','editar','versao'].includes(h[0])) LAST_LIST = location.hash || '#/';
  scrollTo(0,0);
}
function refresh(){ const y = scrollY; const tab = render(); if(tab!=='redirect') setTabbar(tab); scrollTo(0,y) }
addEventListener('hashchange', route);

const CAL = {view:'week', anchor:null, focus:null, sel:null};
function shiftIso(s, n){ const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d) }
function weekStart(s){ const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() - d.getDay()); return iso(d) }
const fmtD = (s, o) => new Date(s + 'T12:00:00').toLocaleDateString('pt-BR', o).replace('.', '');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const plansOn = s => DB.plan.filter(p=>p.date===s && REC(p.rid));
function marketTxt(short){
  const m = DB.market;
  if (!m.to) return 'de todo o cardápio';
  if (short && m.to !== todayIso()) return `até ${fmtD(m.to, {weekday:'short', day:'numeric', month:'short'}).replace(/\./g,'')}`;
  return `até ${lowerFirst(dayLabel(m.to, true))}`;
}
function renderCalendar(){
  document.title = 'Calendário';
  const t = todayIso(); CAL.anchor = CAL.anchor || t;
  let body = '';
  const dayName = d => d===t ? 'Hoje' : d===shiftIso(t,1) ? 'Amanhã' : cap(fmtD(d,{weekday:'long'}));
  const dayBlock = (d, opts={}) => { const ps = plansOn(d);
    return `<section class="cal-day ${d===t ? 'is-today' : ''}" id="d-${d}">
      <div class="cal-dh"><b>${dayName(d)}</b><span>${fmtD(d,{weekday: d===t || d===shiftIso(t,1) ? 'short' : undefined, day:'numeric', month:'short'}).replace(/\./g,'')}</span></div>
      ${ps.length ? `<ul class="cake-list">${ps.map(planRow).join('')}</ul>` : ''}
      <button class="cal-new" data-add="${d}">${ICON.plus}<span>${ps.length ? 'Adicionar outra receita' : 'Planejar receita'}</span></button>
    </section>` };
  if(CAL.view==='week'){
    const days = [...Array(7)].map((_,i)=>shiftIso(t, i));
    const undated = DB.plan.filter(p=>!p.date && REC(p.rid));
    body = days.map(d=>dayBlock(d)).join('')
      + (undated.length ? `<section class="cal-day"><div class="cal-dh"><b>Sem data</b></div><ul class="cake-list">${undated.map(planRow).join('')}</ul></section>` : '');
  } else {
    const first = CAL.anchor.slice(0,8) + '01', gs = weekStart(first);
    const month = cap(fmtD(first, {month:'long', year:'numeric'}));
    const cells = [...Array(42)].map((_,i)=>shiftIso(gs, i));
    const lastRow = cells.slice(35).every(d=>d.slice(0,7)!==first.slice(0,7)) ? 35 : 42;
    if(!CAL.sel || CAL.sel.slice(0,7)!==first.slice(0,7)) CAL.sel = t.slice(0,7)===first.slice(0,7) ? t : first;
    body = `<div class="cal-nav"><button class="icon-btn" data-mo="-1" aria-label="Mês anterior">${ICON.back}</button><b>${month}</b><button class="icon-btn flip" data-mo="1" aria-label="Próximo mês">${ICON.back}</button></div>
      <div class="mgrid">${['D','S','T','Q','Q','S','S'].map(x=>`<span class="mh">${x}</span>`).join('')}
      ${cells.slice(0, lastRow).map(d=>{ const ps = plansOn(d), out = d.slice(0,7)!==first.slice(0,7);
        return `<button class="mcell ${out ? 'out' : ''} ${d===t ? 'is-today' : ''} ${d < t ? 'is-past' : ''}" data-day="${d}" aria-pressed="${d===CAL.sel}" aria-label="${fmtD(d,{weekday:'long', day:'numeric', month:'long'})}${ps.length ? `, ${ps.length} ${ps.length===1 ? 'receita' : 'receitas'}` : ''}">
          <span class="mn">${+d.slice(8)}</span><span class="mdots">${ps.slice(0,3).map(p=>`<i style="background:${toneOf(REC(p.rid))}"></i>`).join('')}${ps.length > 3 ? '<em>+</em>' : ''}</span></button>` }).join('')}</div>
      ${dayBlock(CAL.sel)}`;
  }
  const nBuy = buyCount();
  $('#app').innerHTML = `<div class="wrap">
    <header class="home-head"><div class="hh-row"><h1>Calendário</h1></div></header>
    <div class="seg" role="tablist"><button role="tab" data-view="week" aria-selected="${CAL.view==='week'}">Próximos 7 dias</button><button role="tab" data-view="month" aria-selected="${CAL.view==='month'}">Mês</button></div>
    <div class="mkt"><span class="t"><b>Mercado</b><small>${nBuy ? `${nBuy} ${nBuy===1 ? 'item' : 'itens'}` : 'Nada'} para comprar, para as refeições ${marketTxt()}.</small></span>
      <button class="tbtn" data-act="mkt">Planejar</button></div>
    ${body}
  </div>`;
  if(CAL.focus){ const el = document.getElementById('d-' + CAL.focus); CAL.focus = null; if(el) setTimeout(()=>el.scrollIntoView({block:'start'}), 0) }
  $('#app').onclick = e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.plan){ const pl = DB.plan.find(x=>x.id===b.dataset.plan); if(pl) openPlanSheet(REC(pl.rid), pl.id); return }
    if(b.dataset.add){ openAddSheet(b.dataset.add); return }
    if(b.dataset.view){ CAL.view = b.dataset.view; return refresh() }
    if(b.dataset.mo){ const d = new Date(CAL.anchor.slice(0,8) + '15T12:00:00'); d.setMonth(d.getMonth() + +b.dataset.mo); CAL.anchor = iso(d); CAL.sel = null; return refresh() }
    if(b.dataset.day){ const d = b.dataset.day; if(d.slice(0,7)!==CAL.anchor.slice(0,7)) CAL.anchor = d; CAL.sel = d; const y = scrollY; renderCalendar(); scrollTo(0,y); return }
    if(b.dataset.act==='mkt') openMarketSheet();
  };
}

/* Filtro principal: receitas que dá para fazer com o que tem na despensa */
const hasPantry = () => Object.keys(DB.pantry).length > 0;

/* Adicionar receita num dia */
const AQ = {now:false, fav:false, t:{}};
function openAddSheet(day, meal){
  const st = {kind:'all', q:''};
  const anyF = () => AQ.now || AQ.fav || MORE_F.some(k=>AQ.t[k]);
  const row = c => { const s = status(c), sl = selos(c);
    return `<button class="pick" data-pick="${c.id}">${swatch(c,'sm')}<span class="txt"><b>${esc(c.name)}${isFav(c.id) ? `<i class="pk-fav">${ICON.heartOn}</i>` : ''}</b>${sl.length ? `<span class="sels-row">${sl.map(([k,l])=>`<i class="sel ${k}">${l}</i>`).join('')}</span>` : ''}<small class="${s.ok ? 'okt' : s.swapOnly ? '' : 'miss'}">${esc(statusTxt(s))}</small></span>${ICON.plus}</button>` };
  const controls = el => {
    el.querySelector('#aflt').innerHTML = nowChip(AQ.now, 'data-af') + (DB.favs.length || AQ.fav ? `<button class="fchip fv" data-af="fav" aria-pressed="${AQ.fav}">${AQ.fav ? ICON.heartOn : ICON.heart}Favoritas</button>` : '')
      + MORE_F.map(k=>`<button class="fchip" data-at="${k}" aria-pressed="${!!AQ.t[k]}">${ICON.ok}${TAGDEF.find(x=>x[0]===k)[2]}</button>`).join('');
  };
  const list = el => {
    const q = plain(st.q.trim());
    let all = q ? ALL().filter(c=>plain(c.name).includes(q) || plain(CATN(c.cat)).includes(q) || c.ing.some(i=>plain(i.n).includes(q))) : ALL().filter(c=>isKind(c, st.kind));
    if(AQ.fav) all = favs().filter(c=>all.includes(c));
    MORE_F.filter(k=>AQ.t[k]).forEach(k=>{ all = all.filter(c=>hasTag(c,k)) });
    setNowN(el, all);
    if(AQ.now) all = all.filter(canMake);
    all = RQ.sort==='pad' ? [...all].sort((a,b)=>(status(b).ok?1:0) - (status(a).ok?1:0)) : sortRecipes(all);

      + `<div class="picks">${all.map(row).join('') || `<p class="empty">${AQ.now && !Object.keys(DB.pantry).length ? 'Marque o que tem em casa na Despensa para ver o que dá para fazer.' : 'Nenhuma receita com esses filtros.'}</p>`}</div>`;
    el.querySelector('#asort').onchange = e=>{ RQ.sort = e.target.value; DB.prefs.sort = RQ.sort; save(); list(el) };
  };
  openSheet(`<div class="sh-head"><h2>${day===todayIso() ? 'Hoje' : day===addDays(1) ? 'Amanhã' : cap(fmtD(day,{weekday:'long', day:'numeric', month:'short'}))}</h2><button class="sh-done" data-close>Fechar</button></div>
    <div class="sh-body">
      <div class="seg" id="ameal"><button data-kind="all" aria-pressed="true">Tudo</button>${KINDS.map(([k,l])=>`<button data-kind="${k}" aria-pressed="false">${l}</button>`).join('')}</div>
      <label class="search mt">${ICON.search}<input id="aq" type="search" placeholder="Buscar receita ou ingrediente" autocomplete="off"></label>
      <div class="fchips" id="aflt"></div>
      <div id="plist2"></div></div>`, el=>{
    controls(el); list(el);
    el.querySelector('#aq').oninput = e=>{ st.q = e.target.value; list(el) };
    el.addEventListener('click', e=>{
      const m = e.target.closest('[data-kind]');
      if(m){ st.kind = m.dataset.kind; el.querySelectorAll('#ameal button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.kind===st.kind)); list(el); return }
      const f = e.target.closest('[data-af],[data-at],[data-aclear]');

        if(f.dataset.af==='now' && !AQ.now && !hasPantry()){ pantryHint(); return }
        if(f.dataset.af) AQ[f.dataset.af] = !AQ[f.dataset.af];
        else if(f.dataset.at) AQ.t[f.dataset.at] = !AQ.t[f.dataset.at];

function openPlanSheet(c, planId){

        : `<div class="field"><label for="pl-pan">Forma</label><select id="pl-pan">${PANS.map(p=>`<option value="${p.id}" ${p.id===d.pan ? 'selected' : ''}>${p.n}</option>`).join('')}</select></div>
           <div class="field"><label for="pl-top">Cobertura</label><select id="pl-top">${TOPS.map(t=>`<option value="${t.id}" ${t.id===d.top ? 'selected' : ''}>${t.name}</option>`).join('')}</select></div>`}</div>

      <button class="btn primary block" data-pl="save">${pl ? 'Salvar' : 'Adicionar ao cardápio'}</button>
      ${pl ? `<button class="btn secondary block" data-pl="cook">Começar preparo</button>

  };
  openSheet(`<div class="sh-head"><h2>${pl ? esc(c.name) : 'Vou fazer'}</h2><button class="sh-done" data-close>Fechar</button></div><div class="sh-body"></div>`, el=>{
    draw(el);
    el.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.day!=null){ d.date = b.dataset.day || null; draw(el) }
      else if(b.dataset.sv){ d.serves = Math.max(1, d.serves + +b.dataset.sv); draw(el) }
      else if(b.dataset.pl==='save'){
        if(pl) Object.assign(pl, d); else DB.plan.push(Object.assign({id:uid(), rid:c.id}, d));
        save(); closeSheet(true); refresh();
        toast(pl ? 'Cardápio atualizado' : (status(c, cfgOf(c,d)).ok ? 'Adicionado ao cardápio' : 'Adicionado. O que falta foi para a lista de compras.'));

      else if(b.dataset.pl==='cook'){ Object.assign(pl, d); save(); closeSheet(true); startCook(c, pl.id) }
    });
  }, {label:'Vou fazer'});
}
function startCook(c, planId){
  const st = S(c);
  const pl = planId && DB.plan.find(x=>x.id===planId);
  if(pl){
    if(c.scale==='forma'){ st.mode = 'forma'; st.pan = pl.pan || st.pan; st.top = pl.top || st.top; st.panManual = false }
    else st.serves = pl.serves || st.serves;
  }
  st.planId = planId || null; save(); unlockAudio();
  location.hash = `#/r/${c.id}/preparo/${resumeIdx(c) ?? 0}`;
}

function SORTS_OK(k){ return ['pad','tempo','falta','prot','carb','kcal','feitas','nome'].includes(k) ? k : null }
const SORTS = [['pad','Padrão','Ordem da categoria'],['tempo','Mais rápidas','Menor tempo total primeiro'],['falta','Falta menos','Menos ingredientes para comprar'],['prot','Mais proteína','Por porção, estimado'],['carb','Menos carboidrato','Por porção, estimado'],['kcal','Menos calorias','Por porção, estimado'],['feitas','Mais feitas','Pelo seu histórico'],['nome','A a Z','Ordem alfabética']];
function sortRecipes(list){
  const k = RQ.sort, key = {
    tempo: c=>totalMin(c, calc(c), topOf(c)),
    falta: c=>{ const s = status(c); return s.miss.length + s.short.length },
    prot: c=>{ const n = nutri(c); return n ? -n.p : 1e9 },
    carb: c=>{ const n = nutri(c); return n ? n.c : 1e9 },
    kcal: c=>{ const n = nutri(c); return n ? n.kcal : 1e9 },
    feitas: c=>{ const h = hist(c.id); return h.length ? -(h.length*1e13 + h[h.length-1].at) : 1e15 }
  }[k];
  if(k==='nome') return [...list].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  if(!key) return list;
  const m = new Map(list.map(c=>[c, key(c)]));
  return [...list].sort((a,b)=>m.get(a) - m.get(b));
}

function bindRecipe(c){
  const app = $('#app');
  app.onclick = e=>{
    const b = e.target.closest('button'); if(!b) return;
    const st = S(c);
    if(b.dataset.sub){ ingClick(b,c); return refresh() }
    if(b.dataset.tab){ st.tab = b.dataset.tab; CONFIRM = null; save(); return refresh() }
    if(b.dataset.sv){ st.serves = Math.max(1, (st.serves || c.serves) + +b.dataset.sv); save(); return refresh() }
    if(b.dataset.del){
      if(CONFIRM===b.dataset.del){ DB.history = DB.history.filter(e=>e.id!==b.dataset.del); CONFIRM = null; toast('Registro apagado') }
      else CONFIRM = b.dataset.del;
      save(); return refresh();
    }
    switch(b.dataset.act){
      case 'fav': askFav(c); break;
      case 'pan': openPanSheet(c); break;
      case 'top': openTopSheet(c); break;
      case 'plan': openPlanSheet(c); break;
      case 'drop': abandonCook(c); refresh(); break;
      case 'editplan': { const pl = DB.plan.find(p=>p.rid===c.id); if(pl) openPlanSheet(c, pl.id); break }
      case 'cook': {
        const t = todayIso();
        const pl = DB.plan.filter(p=>p.rid===c.id).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'))[0];
        startCook(c, pl && (!pl.date || pl.date <= addDays(1)) ? pl.id : null); break;
      }
    }
  };
  const note = $('#note');
  if(note){
    let t;
    note.oninput = ()=>{ clearTimeout(t); t = setTimeout(()=>{ const st = S(c); st.note = note.value; st.noteAt = Date.now(); save(); const p = $('#note-at'); if(p) p.textContent = 'Salva em ' + new Date(st.noteAt).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) }, 400) };
  }
}
function openPanSheet(c){
  const draw = el => {
    const st = S(c), cc = calc(c, st), opts = c.ing.filter(scalable), b = cc.baseIng;
    el.querySelector('.sh-body').innerHTML = `
      <div class="seg" role="group" aria-label="Calcular a partir de">
        <button data-mode="forma" aria-pressed="${st.mode==='forma'}">Pela forma</button>
        <button data-mode="ing" aria-pressed="${st.mode==='ing'}">Pelo que tenho</button>
      </div>
      ${st.mode==='ing' ? `<div class="card mt">
          <div class="field"><label for="base">Ingrediente</label>
            <select id="base">${opts.map(i=>`<option value="${i.id}" ${b && i.id===b.id ? 'selected' : ''}>${esc(shortName(i.n) || i.n)}</option>`).join('')}</select></div>
          <div class="field"><label for="amt">Quantidade</label>
            <span class="amt"><input id="amt" inputmode="decimal" enterkeyhint="done" value="${st.amt ? numTxt(st.amt) : ''}" placeholder="${b ? nf(b.u==='un' ? Math.round(b.q) : b.q) : ''}"><span>${b ? b.u : ''}</span></span></div>
        </div>
        ${st.amt ? fitNote(cc) : '<p class="cap">Informe quanto você tem: o app calcula o resto e sugere a forma.</p>'}` : ''}
      <p class="sh-sub">${st.mode==='ing' ? 'Forma' : 'Escolha a forma'}</p>
      <div class="opts">${PANS.map(p=>`<button class="opt" data-pan="${p.id}" aria-pressed="${p.id===cc.pan.id}"><span>${p.n}</span>${st.mode==='ing' && st.amt && cc.suggested && p.id===cc.suggested.id ? '<span class="tag">Sugerida</span>' : ''}<span class="radio"></span></button>`).join('')}</div>`;
    const base = el.querySelector('#base'), amt = el.querySelector('#amt');
    if(base) base.onchange = ()=>{ st.base = base.value; st.amt = null; st.panManual = false; save(); draw(el) };
    if(amt){ amt.onchange = ()=>{ const v = num(amt.value); st.amt = v > 0 ? v : null; st.panManual = false; save(); draw(el) }; amt.onkeydown = e=>{ if(e.key==='Enter') amt.blur() } }
  };
  openSheet(`<div class="sh-head"><h2>Forma</h2><button class="sh-done" data-close>Pronto</button></div><div class="sh-body"></div>`, el=>{
    draw(el);
    el.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return; const st = S(c);
      if(b.dataset.mode){ st.mode = b.dataset.mode; st.panManual = false; save(); draw(el) }
      else if(b.dataset.pan){ st.pan = b.dataset.pan; if(st.mode==='ing'){ st.panManual = true; save(); draw(el) } else { save(); closeSheet() } }
    });
  }, {label:'Forma', onClose:refresh});
}
function openTopSheet(c){
  const st = S(c), sugg = c.tops, rest = TOPS.map(t=>t.id).filter(id=>!sugg.includes(id));
  const row = id => { const t = TOP(id); return `<button class="opt" data-top="${id}" aria-pressed="${id===st.top}"><span class="ot"><b>${t.name}</b><small>${t.desc}</small></span><span class="radio"></span></button>` };
  openSheet(`<div class="sh-head"><h2>Cobertura</h2><button class="sh-done" data-close>Pronto</button></div>

    ${rest.length ? `<p class="sh-sub">Outras</p><div class="opts">${rest.map(row).join('')}</div>` : ''}</div>`, el=>{
    el.addEventListener('click', e=>{ const b = e.target.closest('[data-top]'); if(!b) return; st.top = b.dataset.top; save(); closeSheet() });

function shareText(txt){
  if(navigator.share) navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada'));
}

const PQ = {q:'', f:'all', edit:null};
function renderPantry(mode){
  const T = mode==='home' ? 'Despensa' : 'Compras';
  document.title = T;
  $('#app').innerHTML = `<div class="wrap">
    <header class="home-head"><div class="hh-row"><h1>${T}</h1></div></header>
    <div id="pbody"></div>

/* ---------- Despensa: em casa ---------- */
function planNeeds(){
  const m = new Map();
  for(const pl of DB.plan){ const c = REC(pl.rid); if(!c) continue; const cfg = cfgOf(c, pl);
    for(const e of needs(c, calc(c, cfg), topOf(c, cfg)).values()){ if(!m.has(e.p)) m.set(e.p, []); if(!m.get(e.p).includes(c.name)) m.get(e.p).push(c.name) } }
  return m;
}
function pantryHome(){
  const q = plain(PQ.q.trim()), need = planNeeds();
  const pass = p => !CAT[p].skip && (!q || plain(CAT[p].n).includes(q))
    && (PQ.f==='all' || (PQ.f==='have' && DB.pantry[p]) || (PQ.f==='no' && !DB.pantry[p]) || (PQ.f==='plan' && need.has(p)));
  const sorted = arr => arr.sort((a,b)=>CAT[a].n.localeCompare(CAT[b].n, 'pt-BR'));
  const secs = SECS.map(([k,l])=>{ const all = CAT_ORDER.filter(p=>CAT[p].sec===k);
    return {k, l, ids: sorted(all.filter(pass)), have: all.filter(p=>DB.pantry[p]).length, total: all.length} });
  const onList = new Map(shopData().rows.map(x=>[x.p, x]));
  const row = p => {
    const C = CAT[p], h = DB.pantry[p], u = punit(p), editing = PQ.edit===p, why = need.get(p), L = onList.get(p);

      ${h && u ? `<button class="qbtn ${h.q > 0 ? '' : 'empty'}" data-pq="${p}" aria-label="Quantidade de ${esc(C.n.toLowerCase())}">${h.q > 0 ? qtyTxt(p, h.q) : 'Quantidade'}</button>` : ''}
      ${C.noBuy ? '' : `<button class="cartbtn" data-cart="${p}" aria-pressed="${!!L}" aria-label="${L ? 'Na lista de compras' : 'Pôr na lista de compras'}: ${esc(C.n.toLowerCase())}">${ICON.cart}</button>`}
    </div>
    ${editing ? `<div class="pedit"><span class="amt"><input id="pq-in" inputmode="decimal" enterkeyhint="done" value="${h && h.q > 0 ? numTxt(h.q) : ''}" placeholder="—" aria-label="Quantidade"><span>${u}</span></span>
      <button class="tbtn" data-pqok="${p}">Salvar</button>${h && h.q > 0 ? `<button class="tbtn" data-pqclear="${p}">Sem quantidade</button>` : ''}
      ${C.hint ? `<small>${C.hint}</small>` : ''}</div>` : ''}`;
  };
  const shown = secs.filter(s=>s.ids.length);
  const filters = [['all','Todos'],['have','Tenho'],['no','Não tenho'],['plan','Do cardápio']];
  $('#pbody').innerHTML = `
    <div class="ptools">
      <label class="search">${ICON.search}<input id="pq" type="search" placeholder="Buscar ingrediente" value="${esc(PQ.q)}" autocomplete="off"></label>
      <div class="chiprow">${filters.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${PQ.f===k}">${l}</button>`).join('')}</div>
      ${!q && shown.length > 1 ? `<div class="jump" role="navigation" aria-label="Seções">${shown.map(s=>`<button data-jump="${s.k}">${s.l.split(',')[0]}</button>`).join('')}</div>` : ''}
    </div>
    ${PQ.f==='all' && !q ? `<div class="prow-actions"><span class="cap" style="margin:0">Com a quantidade, o app desconta o que você usar.</span><button class="tbtn" data-act="basics">${BASICS.every(b=>DB.pantry[b]) ? 'Desmarcar básicos' : 'Marcar básicos'}</button></div>` : ''}
    <div id="plist">${shown.length ? shown.map(s=>`<h3 class="psec" id="sec-${s.k}">${s.l}<span class="num">${s.have} de ${s.total}</span></h3>${s.ids.map(row).join('')}`).join('')
      : `<p class="empty" style="margin-top:16px">${PQ.f==='plan' ? 'Nenhuma receita no cardápio ainda.' : 'Nenhum ingrediente encontrado.'}</p>`}</div>`;
  const inp = $('#pq');
  inp.oninput = ()=>{ PQ.q = inp.value; const pos = inp.selectionStart; pantryHome(); const n = $('#pq'); n.focus(); n.setSelectionRange(pos,pos) };
  const qin = $('#pq-in');
  if(qin){ qin.focus(); qin.onkeydown = e=>{ if(e.key==='Enter') $('[data-pqok]').click() } }

    const b = e.target.closest('button'); if(!b) return;

      const p = b.dataset.cart, r0 = shopData().rows.find(x=>x.p===p);

    if(b.dataset.pqclear){ DB.pantry[b.dataset.pqclear] = {q:null}; PQ.edit = null; return re() }

    if(b.dataset.act==='basics'){ const all = BASICS.every(x=>DB.pantry[x]); BASICS.forEach(x=>{ if(all) delete DB.pantry[x]; else if(!DB.pantry[x]) DB.pantry[x] = {q:null} }); return re() }
  };
}

      DB.pantry[p] = {q: add ? Math.round(((prev && prev.q) || 0) + add) : (prev ? prev.q : null)};
      const ex = DB.extras.filter(x=>x.p===p); DB.extras = DB.extras.filter(x=>x.p!==p);
      DB.bought.push({p, prev, add, ex}); return re();
    }
    if(b.dataset.undo!=null){ const x = DB.bought[+b.dataset.undo]; if(x){ if(x.prev) DB.pantry[x.p] = x.prev; else delete DB.pantry[x.p]; if(x.ex) DB.extras.push(...x.ex); DB.bought.splice(+b.dataset.undo, 1) } return re() }
    if(b.dataset.ex){ const x = DB.extras.find(y=>y.id===b.dataset.ex); if(x) x.done = !x.done; return re() }

      shareText('Lista de compras\n' + lines.join('\n'));
    }
  };
}

let IMPORT_DRAFT = '';
function b64(bytes){ let s = ''; for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'') }
function unb64(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; const bin = atob(s), out = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out }
async function exportCode(){
  const json = JSON.stringify(Object.assign({}, DB, {timers:{}}));
  if(window.CompressionStream){
    const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'RCT1.' + b64(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  return 'RCT0.' + b64(new TextEncoder().encode(json));
}
async function importCode(code){
  code = code.replace(/\s+/g,'');
  const dot = code.indexOf('.'), pre = code.slice(0, dot), data = code.slice(dot + 1);
  if(dot < 0 || !/^RCT[01]$/.test(pre)) throw new Error('prefix');
  let bytes = unb64(data), json;
  if(pre==='RCT1'){
    if(!window.DecompressionStream) throw new Error('nodecomp');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    json = await new Response(stream).text();
  } else json = new TextDecoder().decode(bytes);
  const obj = JSON.parse(json);
  if(!obj || typeof obj!=='object' || !obj.prefs) throw new Error('shape');
  DB = obj; normalize(); invalidate(); save(); RQ.sort = SORTS_OK(DB.prefs.sort) || 'pad';
}
function runShortcut(secs){ location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(SHORTCUT) + '&input=text&text=' + Math.round(secs) }
function clockAlarm(secs){ if(DB.prefs.alarm && secs >= ALARM_MIN){ runShortcut(secs); return true } return false }

  }

  const ing = c.ing.map(i=>{
    const n = i.opt ? `${i.n} (opcional)` : i.n; names[i.id] = n;
    return {id:i.id, n, n0:n, q: i.u==='pitada' ? 1 : Math.round(i.q*10)/10, u:i.u, s:i.s, s1:i.s1, r:i.r, cup:i.cup, sp:i.sp, each:i.each};

function drawKeep(){ const y = scrollY; drawEditor(); scrollTo(0,y) }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') }
function bindEditor(){
  const app = $('#app'), d = ED.d;

    const t = e.target;

      else if(['temp','serves','time'].includes(f)) d[f] = num(t.value);
      else if(f!=='cat' && f!=='ref') d[f] = t.value }
    else if(t.dataset.i!=null){ const x = d.ing[+t.dataset.i];
      if(t.dataset.k==='q') x.q = num(t.value);
      else if(t.dataset.k==='n'){ if(x._old==null) x._old = x.n; x.n = t.value } }
    else if(t.dataset.s!=null){ const s = d.steps[+t.dataset.s];
      if(t.dataset.k==='timer') s.timer = Math.round(num(t.value)*60); else s[t.dataset.k] = t.value }
  };
  app.onchange = e=>{
    const t = e.target;
    if(t.dataset.f==='ref') d.ref = t.value;
    if(t.dataset.f==='cat'){ d.cat = t.value; if(d.cat==='bolos'){ d.meals = ['cafe','lanche']; d.kinds = ['lan','sob']; d.oven = true } drawKeep(); return }
    if(t.dataset.i!=null && t.dataset.k==='u'){ d.ing[+t.dataset.i].u = t.value; drawKeep(); return }
    if(t.dataset.i!=null && t.dataset.k==='n'){
      const x = d.ing[+t.dataset.i], old = (x._old || '').trim(), nw = (x.n || '').trim();
      if(old && nw && old!==nw){
        const re = new RegExp('\\[' + escRe(old) + '\\]', 'gi');
        d.steps.forEach(s=>{ s.d = (s.d || '').replace(re, '[' + nw + ']') });
        app.querySelectorAll('textarea[data-k="d"]').forEach(ta=>{ ta.value = d.steps[+ta.dataset.s].d });
      }
      delete x._old;
      app.querySelector('.tokens-wrap').innerHTML = tokensHTML();
    }
  };
  app.onclick = e=>{

    if(b.dataset.tok!=null){ insertTok(b.dataset.tok); return }
    if(b.dataset.rmi!=null){ d.ing.splice(+b.dataset.rmi, 1); if(!d.ing.length) d.ing.push({n:'',q:0,u:'g'}); return drawKeep() }
    if(b.dataset.rms!=null){ d.steps.splice(+b.dataset.rms, 1); if(!d.steps.length) d.steps.push({t:'',d:'',timer:0}); ED.lastTA = null; return drawKeep() }
    switch(b.dataset.act){
      case 'cancel': ED = null; if(history.length > 1) history.back(); else location.hash = '#/receitas'; break;
      case 'oven': d.oven = !d.oven; drawKeep(); break;
      case 'addi': d.ing.push({n:'',q:0,u:'g'}); drawKeep(); { const ins = app.querySelectorAll('.ed-name'); ins[ins.length-1].focus() } break;
      case 'adds': d.steps.push({t:'',d:'',timer:0}); drawKeep(); break;

    }

}
